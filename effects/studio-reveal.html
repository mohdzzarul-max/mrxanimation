<!doctype html>
<html><head><meta charset="utf-8"><title>Studio Reveal</title>
<link rel="stylesheet" href="lib/fx.css">
<style>
  #stage { background: #000; }
  .beam { position: absolute; top: -80px; width: 560px; height: 2300px; z-index: 3; mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(90deg, transparent 8%, #000 38%, #000 62%, transparent 92%);
    mask-image: linear-gradient(90deg, transparent 8%, #000 38%, #000 62%, transparent 92%);
    background: linear-gradient(180deg, rgba(255,236,210,0.55), rgba(255,220,180,0.08) 75%, transparent);
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); }
  #b1 { left: -230px; transform-origin: 50% 0; } #b2 { right: -230px; transform-origin: 50% 0; }
  .lamp { position: absolute; top: -40px; width: 160px; height: 90px; border-radius: 0 0 80px 80px; z-index: 4;
    background: radial-gradient(60% 80% at 50% 0%, #fff, #ffd9a8 40%, transparent 70%); }
  #floor { position: absolute; left: 90px; right: 90px; top: 1560px; height: 260px; z-index: 1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,214,170,0.45), transparent); }
  #title { position: absolute; left: 0; right: 0; top: 1480px; z-index: 5; text-align: center; white-space: nowrap;
    font: 900 120px var(--display); text-transform: uppercase; }
  #title i { display: inline-block; font-style: normal; }
  #kicker { position: absolute; left: 0; right: 0; top: 1430px; z-index: 5; text-align: center;
    font: 700 32px var(--mono); letter-spacing: 12px; color: var(--accent); }
  #dust { z-index: 4; mix-blend-mode: screen; }
</style></head>
<body><div id="stage">
  <canvas id="back" class="layer" width="1080" height="1920"></canvas>
  <div id="floor"></div>
  <canvas id="subj" class="layer" width="1080" height="1920" style="z-index:2"></canvas>
  <div class="beam" id="b1"></div><div class="beam" id="b2"></div>
  <div class="lamp" style="left:20px"></div><div class="lamp" style="right:20px"></div>
  <canvas id="dust" class="layer" width="1080" height="1920"></canvas>
  <div id="kicker">NOW SHOWING</div>
  <div id="title"></div>
</div>
<script src="lib/fx.js"></script>
<script>
/* Studio Reveal: total darkness, the lights clunk on with a flicker, two spot beams swing onto
   the speaker, the set fades up, then the title letters rise in. */
const { W, H, k, lerp, prog, ease, rng, drawScene, run } = fx;
const TITLE = 'The Studio';
const back = document.getElementById('back'), subj = document.getElementById('subj'), dust = document.getElementById('dust');
const bctx = back.getContext('2d'), sctx = subj.getContext('2d'), dctx = dust.getContext('2d');
const b1 = document.getElementById('b1'), b2 = document.getElementById('b2'), lamps = [...document.querySelectorAll('.lamp')];
const titleEl = document.getElementById('title'), kicker = document.getElementById('kicker');
titleEl.innerHTML = [...TITLE].map(c => `<i>${c === ' ' ? '&nbsp;' : c}</i>`).join('');
const letters = [...titleEl.children];
const r = rng(5), motes = [...Array(70)].map(() => ({ x: r() * W, y: r() * H, s: 1 + r() * 3, v: 10 + r() * 25, ph: r() * 6 }));
// lights-on flicker: off/on pattern between 0.45 s and 0.8 s
const FLICK = [[0.45, 1], [0.5, 0.2], [0.56, 0.9], [0.6, 0.35], [0.66, 1]];
const flick = t => { let v = 0; for (const [at, on] of FLICK) if (t >= at) v = on; return v; };

run({ duration: 4.2, update: async t => {
  const separate = await drawScene(bctx, sctx, t);
  const on = flick(t);
  const sweep = ease.inOut(prog(t, 0.6, 1.3));
  b1.style.transform = `rotate(${lerp(-45, -22, sweep)}deg)`; b2.style.transform = `rotate(${lerp(45, 22, sweep)}deg)`;
  b1.style.opacity = b2.style.opacity = on;
  lamps.forEach(l => (l.style.opacity = on));
  const set = k(t, 1.0, 1.3, 'inOut'), person = k(t, 0.75, 1.0, 'inOut');
  back.style.filter = `brightness(${lerp(0, 1, set)})`;
  subj.style.filter = `brightness(${lerp(0, 1, person) * (0.4 + 0.6 * on)})`;
  if (!separate) back.style.filter = `brightness(${lerp(0, 1, Math.max(set, person * 0.6))})`;
  document.getElementById('floor').style.opacity = on * lerp(0.3, 1, sweep);
  dctx.clearRect(0, 0, W, H);
  motes.forEach(m => {
    const y = (m.y - t * m.v + H) % H, x = m.x + Math.sin(t + m.ph) * 12;
    dctx.fillStyle = `rgba(255,230,200,${0.35 * on * (0.5 + 0.5 * Math.sin(t * 3 + m.ph))})`;
    dctx.beginPath(); dctx.arc(x, y, m.s, 0, Math.PI * 2); dctx.fill();
  });
  letters.forEach((l, i) => {
    const p = k(t, 2.2 + i * 0.05, 0.55, 'back');
    l.style.opacity = Math.min(1, p * 1.4); l.style.transform = `translateY(${lerp(70, 0, p)}px)`;
  });
  const kp = k(t, 2.05, 0.5);
  kicker.style.opacity = kp; kicker.style.letterSpacing = `${lerp(30, 12, kp)}px`;
}});
</script></body></html>
