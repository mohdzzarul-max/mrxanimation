<!doctype html>
<html><head><meta charset="utf-8"><title>Zoom Through Cut</title>
<link rel="stylesheet" href="lib/fx.css">
<style>#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 2; }</style>
</head>
<body><div id="stage">
  <canvas id="out" class="layer" width="1080" height="1920"></canvas>
  <div id="flash"></div>
</div>
<script src="lib/fx.js"></script>
<script>
/* Zoom Through Cut: shot A accelerates into a hard zoom, the cut happens at peak speed,
   and shot B lands from the same zoom and decelerates, so the zoom hides the cut.
   Zoom blur = the frame redrawn a few times at slightly bigger scales, stronger the faster it moves.
   Shot A = footage, shot B = broll. */
const { W, H, clamp, lerp, prog, ease, drawFootage, head, run } = fx;
const CUT = 1.3, PEAK = 4.2;
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); };
const A = mk(), B = mk(), out = document.getElementById('out').getContext('2d'), flash = document.getElementById('flash');
const zoomAt = t => t < CUT
  ? 1 + 0.06 * prog(t, 0, 0.9) + (PEAK - 1) * ease.inExpo(prog(t, 0.8, CUT - 0.8))
  : 1 + (PEAK - 1) * (1 - ease.outExpo(prog(t, CUT, 0.55)));

run({ duration: 2.6, update: async t => {
  const isA = t < CUT;
  if (isA) await drawFootage(A, t); else await drawFootage(B, t - CUT, 'broll');
  const src = (isA ? A : B).canvas, s = zoomAt(t);
  // zoom speed from a neighbouring sample on the same side of the cut
  const t2 = isA && t + 1 / 60 >= CUT ? t - 1 / 60 : t + 1 / 60;
  const speed = Math.abs(zoomAt(t2) - s) * 60;
  const h = head(t), ox = isA ? h.x : W / 2, oy = isA ? h.y - 40 : H / 2;
  const blur = clamp(speed / 25);
  out.clearRect(0, 0, W, H);
  const draw = (scale, alpha) => {
    out.globalAlpha = alpha;
    out.setTransform(scale, 0, 0, scale, ox - ox * scale, oy - oy * scale);
    out.drawImage(src, 0, 0);
  };
  draw(s, 1);
  for (let j = 1; j <= 5; j++) draw(s * (1 + 0.035 * j * blur), 0.22 * blur);
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1;
  flash.style.opacity = 0.35 * Math.max(0, 1 - Math.abs(t - CUT) / 0.09);
}});
</script></body></html>
