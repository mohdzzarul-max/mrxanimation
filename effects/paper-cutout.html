<!doctype html>
<html><head><meta charset="utf-8"><title>Paper Cutout</title>
<link rel="stylesheet" href="lib/fx.css">
<style>
  #stage { background: #d8c6a2; }
  #grain { position: absolute; inset: 0; z-index: 20; pointer-events: none; mix-blend-mode: multiply; opacity: 0.55; }
  svg.paper { position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 14px 0 rgba(60,40,20,0.22)); }
  #person { z-index: 6; filter: drop-shadow(8px 0 0 #fbf6ea) drop-shadow(-8px 0 0 #fbf6ea) drop-shadow(0 8px 0 #fbf6ea)
    drop-shadow(0 -8px 0 #fbf6ea) drop-shadow(0 16px 0 rgba(60,40,20,0.25)); }
  #word { position: absolute; left: 0; right: 0; top: 230px; z-index: 8; text-align: center; white-space: nowrap; }
  .ch { display: inline-block; margin: 0 4px; padding: 6px 18px; font-size: 128px; line-height: 1; box-shadow: 0 8px 0 rgba(60,40,20,0.25); }
</style></head>
<body><div id="stage">
  <canvas id="person" class="layer" width="1080" height="1920"></canvas>
  <div id="word"></div>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.18  0 0 0 0.6 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script src="lib/fx.js"></script>
<script>
/* Paper Cutout: torn-paper layers slide in like stop motion (12 fps steps), the speaker lands as a
   white-edged cutout, and the title arrives as ransom-note letters. */
const { W, H, k, lerp, prog, ease, rng, el, drawSubject, drawFootage, run } = fx;
const WORD = 'CUT&PASTE';
const STEP = 1 / 12;                           // stop-motion: hold each pose for 2 frames at 24/30 fps
const stage = document.getElementById('stage'), person = document.getElementById('person'), pctx = person.getContext('2d');
// a torn-edged polygon around a rectangle
function torn(w, h, seed, jag = 16) {
  const r = rng(seed), pts = [];
  const edge = (x0, y0, x1, y1) => { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 22);
    for (let i = 0; i < n; i++) { const f = i / n; pts.push([x0 + (x1 - x0) * f + (r() - 0.5) * jag * (y0 === y1 ? 0.3 : 1), y0 + (y1 - y0) * f + (r() - 0.5) * jag * (x0 === x1 ? 0.3 : 1)]); } };
  edge(0, 0, w, 0); edge(w, 0, w, h); edge(w, h, 0, h); edge(0, h, 0, 0);
  return pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
}
// [x, y, w, h, colour, slide-from (dx,dy), rotation, z, start time]
const LAYERS = [
  [-60, 1250, 1200, 760, '#1f2a44', [0, 900], -3, 1, 0.1],
  [-80, -60, 640, 900, '#2a9d8f', [-900, 0], 4, 2, 0.3],
  [560, 520, 620, 820, '#f3ead8', [900, 0], -5, 3, 0.45],
  [-40, 1520, 1160, 520, '#ff5a1f', [0, 700], 2, 7, 0.65],
  [120, 1640, 840, 140, '#f3ead8', [-1100, 0], -2, 9, 1.1],
];
const layers = LAYERS.map(([x, y, w, h, col, from, rot, z, at], i) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'paper'); s.setAttribute('width', w); s.setAttribute('height', h);
  s.innerHTML = `<polygon points="${torn(w, h, 20 + i)}" fill="${col}"/>` + (i === 4 ? `<text x="${w / 2}" y="${h / 2 + 22}" text-anchor="middle" font-family="P052, Georgia, serif" font-weight="700" font-size="60" fill="#1f2a44">scissors, glue &amp; a good story</text>` : '');
  s.style.zIndex = z; stage.appendChild(s);
  return { s, x, y, from, rot, at };
});
const COLS = ['#ff5a1f', '#f3ead8', '#1f2a44', '#2a9d8f', '#fbf6ea'], FONTS = ['P052', 'Inter Display', 'JetBrains Mono', 'Lato', 'URW Bookman'];
const r = rng(9), word = document.getElementById('word');
const letters = [...WORD].map((c, i) => {
  const bg = COLS[i % COLS.length], fg = bg === '#1f2a44' || bg === '#2a9d8f' || bg === '#ff5a1f' ? '#fbf6ea' : '#1f2a44';
  const e = el('span', 'ch', word, c);
  e.style.cssText = `background:${bg}; color:${fg}; font-family:'${FONTS[Math.floor(r() * FONTS.length)]}'; font-weight:${r() > 0.5 ? 900 : 700}`;
  return { e, rot: (r() - 0.5) * 16, dy: (r() - 0.5) * 30 };
});

run({ duration: 3.8, update: async t0 => {
  const t = Math.floor(t0 / STEP) * STEP;      // quantised time = stop motion
  layers.forEach(({ s, x, y, from, rot, at }) => {
    const p = ease.out(prog(t, at, 0.5));
    s.style.transform = `translate(${x + from[0] * (1 - p)}px, ${y + from[1] * (1 - p)}px) rotate(${rot + (1 - p) * 8}deg)`;
  });
  pctx.clearRect(0, 0, W, H);
  const pp = ease.back(prog(t, 0.8, 0.5));
  if (fx.hasFootage()) { await drawFootage(pctx, t); person.style.clipPath = 'inset(260px 140px 420px 140px)'; }
  else drawSubject(pctx, t, 0.86);
  person.style.transform = `translateY(${lerp(1100, 40, pp)}px) rotate(${lerp(9, -2, pp)}deg)`;
  letters.forEach(({ e, rot, dy }, i) => {
    const p = ease.back(prog(t, 1.5 + i * 0.09, 0.3));
    e.style.opacity = p > 0 ? 1 : 0;
    e.style.transform = `translateY(${dy}px) rotate(${rot}deg) scale(${p})`;
  });
}});
</script></body></html>
