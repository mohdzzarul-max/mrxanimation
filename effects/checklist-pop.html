<!doctype html>
<html><head><meta charset="utf-8"><title>Checklist Pop</title>
<link rel="stylesheet" href="lib/fx.css">
<style>
  #card { position: absolute; left: 65px; top: 170px; width: 700px; padding: 46px 48px 30px; z-index: 2;
    background: rgba(18,20,25,0.92); border: 2px solid var(--line); border-radius: 44px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45); transform-origin: 0 0; }
  #card h2 { margin: 0 0 26px; font: 800 52px var(--display); letter-spacing: -1px; }
  .row { position: relative; display: flex; align-items: center; gap: 30px; padding: 20px 0;
    font: 600 44px var(--sans); transform-origin: 0 50%; }
  .box { position: relative; flex: none; width: 70px; height: 70px; border-radius: 20px; border: 4px solid #555b66; }
  .box .fill { position: absolute; inset: -4px; border-radius: 20px; background: var(--accent); }
  .box svg { position: absolute; inset: -4px; }
  .box path { fill: none; stroke: var(--accent-ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .spark { position: absolute; left: 35px; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--accent); }
</style></head>
<body><div id="stage">
  <canvas id="shot" class="layer" width="1080" height="1920"></canvas>
  <div id="card"><h2>Before you post</h2></div>
</div>
<script src="lib/fx.js"></script>
<script>
/* Checklist Pop: a card over the shot; each item pops in, then its box fills and a tick draws,
   with a small burst of sparks. */
const { k, lerp, prog, el, drawFootage, run } = fx;
const ITEMS = ['Hook in 3 seconds', 'Show the result', 'Cut the pauses', 'Clear call to action'];
const FIRST = 0.65, STEP = 0.55, TICK = 0.22;
const ctx = document.getElementById('shot').getContext('2d'), card = document.getElementById('card');
const rows = ITEMS.map(text => {
  const r = el('div', 'row', card, `<div class="box"><div class="fill"></div><svg viewBox="0 0 78 78"><path pathLength="1" d="M20 41 L33 54 L58 26"/></svg></div><span>${text}</span>`);
  const sparks = [...Array(8)].map(() => el('div', 'spark', r));
  return { r, fill: r.querySelector('.fill'), path: r.querySelector('path'), text: r.querySelector('span'), sparks };
});

run({ duration: 3.8, update: async t => {
  await drawFootage(ctx, t);
  const c = k(t, 0.15, 0.5, 'back');
  card.style.opacity = Math.min(1, c * 1.5);
  card.style.transform = `scale(${lerp(0.88, 1, c)})`;
  rows.forEach((o, i) => {
    const t0 = FIRST + i * STEP, pop = k(t, t0, 0.4, 'back'), tick = t0 + TICK;
    o.r.style.opacity = Math.min(1, prog(t, t0, 0.15));
    o.r.style.transform = `translateX(${lerp(-40, 0, pop)}px) scale(${lerp(0.7, 1, pop)})`;
    const f = k(t, tick, 0.3, 'back');
    o.fill.style.transform = `scale(${f})`;
    o.fill.style.opacity = prog(t, tick, 0.05);
    o.path.style.strokeDasharray = 1; o.path.style.strokeDashoffset = 1 - k(t, tick + 0.08, 0.25, 'out');
    o.text.style.color = t >= tick ? '#f5f3ee' : '#a7a9b2';
    const b = prog(t, tick, 0.45);
    o.sparks.forEach((s, j) => {
      const a = (j / o.sparks.length) * Math.PI * 2, d = 70 * fx.ease.out(b);
      s.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(${1 - b})`;
      s.style.opacity = b > 0 && b < 1 ? 1 - b : 0;
    });
  });
}});
</script></body></html>
