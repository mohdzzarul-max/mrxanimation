<!doctype html>
<html><head><meta charset="utf-8"><title>MR X – Opening</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;transform-origin:0 0}
  .layer{position:absolute;inset:0;width:1920px;height:1080px}
  #bg{z-index:0}
  #lines{z-index:1}
  .shot{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;display:none;z-index:2;will-change:transform}
  #fx{z-index:3;mix-blend-mode:screen}
  #vig{z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
  #flash{z-index:5;opacity:0}
  #titlebox{position:absolute;z-index:6;left:120px;top:250px;width:1000px;opacity:0}
  #mr,#x{font:900 italic 330px/0.9 'Inter Display','Inter',Arial,sans-serif;letter-spacing:-8px;color:#fff;display:inline-block;
    text-shadow:0 0 30px #8a4dff,0 0 80px #6b2cff}
  #x{color:transparent;-webkit-text-stroke:10px #b98bff;margin-left:30px;text-shadow:0 0 40px #8a4dff,0 0 110px #7a3cff}
  #tag{font:700 44px 'Inter',Arial,sans-serif;letter-spacing:22px;color:#4de8ff;margin:24px 0 0 14px;text-shadow:0 0 18px #19c6e6;opacity:0}
  #fade{z-index:9;background:#000;opacity:0}
</style></head>
<body><div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="lines" class="layer" width="1920" height="1080"></canvas>
  <canvas id="fx" class="layer" width="1920" height="1080"></canvas>
  <div id="vig" class="layer"></div>
  <div id="flash" class="layer"></div>
  <div id="titlebox"><span id="mr">MR</span><span id="x">X</span><div id="tag">ANIMATION</div></div>
  <div id="fade" class="layer"></div>
</div>
<script>
/* MR X opening. Landscape 1920x1080, 30 fps. State is a pure function of time: window.seek(t). */
const DURATION = 34;
const TITLE_TAG = 'ANIMATION';           // tagline under the logo

const A = n => `assets/${n}.jpg`;
// blend: 'normal' | 'screen' (black bg drops out) | 'multiply' (white bg drops out)
// s0->s1 scale, (x0,y0)->(x1,y1) drift in px, from = entrance direction, shake = hit strength, bg = backdrop key
const SHOTS = [
  {n:'lab',        t0:0,    t1:4.5,  s0:1.00,s1:1.16,x0:0,y0:0,x1:-40,y1:10, bg:'lab', fade:.8},
  {n:'walk1',      t0:4.5,  t1:4.95, s0:1.0,s1:1.0,x0:-640,y0:0,x1:-380,y1:0, blend:'multiply',bg:'comic'},
  {n:'walk3',      t0:4.95, t1:5.4,  s0:1.0,s1:1.0,x0:-380,y0:0,x1:-200,y1:0, blend:'multiply',bg:'comic'},
  {n:'walk2',      t0:5.4,  t1:5.85, s0:1.0,s1:1.0,x0:-200,y0:0,x1:-20, y1:0, blend:'multiply',bg:'comic'},
  {n:'walk3',      t0:5.85, t1:6.3,  s0:1.0,s1:1.0,x0:-20, y0:0,x1:160, y1:0, blend:'multiply',bg:'comic'},
  {n:'walk1',      t0:6.3,  t1:6.75, s0:1.0,s1:1.0,x0:160, y0:0,x1:340, y1:0, blend:'multiply',bg:'comic'},
  {n:'walk3',      t0:6.75, t1:7.2,  s0:1.0,s1:1.0,x0:340, y0:0,x1:520, y1:0, blend:'multiply',bg:'comic'},
  {n:'walk2',      t0:7.2,  t1:7.65, s0:1.0,s1:1.0,x0:520, y0:0,x1:700, y1:0, blend:'multiply',bg:'comic'},
  {n:'walk3',      t0:7.65, t1:8.5,  s0:1.0,s1:1.05, x0:700, y0:0,x1:900, y1:0, blend:'multiply',bg:'comic'},
  {n:'crouch',     t0:8.5,  t1:10.6, s0:1.0, s1:1.3, x0:0,y0:10,x1:0,y1:-20, blend:'screen',bg:'purple',shake:14},
  {n:'green',      t0:10.6, t1:13.2, s0:1.05,s1:1.22,x0:0,y0:0,x1:0,y1:-10, blend:'screen',bg:'green',shake:18},
  {n:'mask-eyes',  t0:13.2, t1:14.6, s0:1.0, s1:1.22,x0:0,y0:0,x1:0,y1:0,   blend:'screen',bg:'black',shake:22,eyes:true},
  // action montage
  {n:'stance',     t0:14.6, t1:16.0, s0:1.1, s1:1.3, x0:0,y0:20,x1:0,y1:0,  blend:'screen',bg:'mont',from:'zoom',shake:12},
  {n:'kick',       t0:16.0, t1:17.2, s0:1.05,s1:1.2, x0:120,y0:0,x1:-60,y1:0,blend:'screen',bg:'mont',from:'left',shake:14},
  {n:'punch',      t0:17.2, t1:18.3, s0:1.05,s1:1.2, x0:-100,y0:0,x1:60,y1:0,blend:'screen',bg:'mont',from:'right',shake:14},
  {n:'blast',      t0:18.3, t1:19.4, s0:1.05,s1:1.22,x0:-80,y0:0,x1:40,y1:0, blend:'screen',bg:'mont',from:'left',shake:12},
  {n:'guard',      t0:19.4, t1:20.4, s0:1.1, s1:1.28,x0:0,y0:0,x1:0,y1:0,   blend:'screen',bg:'mont',from:'zoom',shake:18},
  {n:'land',       t0:20.4, t1:21.4, s0:1.05,s1:1.2, x0:0,y0:-30,x1:0,y1:20,blend:'screen',bg:'mont',from:'top',shake:20},
  {n:'fist',       t0:21.4, t1:22.3, s0:1.0, s1:1.15,x0:0,y0:0,x1:0,y1:0,   blend:'screen',bg:'mont',from:'zoom',shake:16},
  {n:'fly-back',   t0:22.3, t1:23.3, s0:1.05,s1:1.2, x0:-120,y0:0,x1:120,y1:0,blend:'screen',bg:'mont',from:'left'},
  {n:'fly',        t0:23.3, t1:24.2, s0:1.05,s1:1.2, x0:100,y0:0,x1:-100,y1:0,blend:'screen',bg:'mont',from:'right'},
  {n:'float',      t0:24.2, t1:25.5, s0:1.05,s1:1.25,x0:0,y0:20,x1:0,y1:-20, blend:'screen',bg:'mont',from:'bottom'},
  // title
  {n:'arms-crossed',t0:26.1,t1:34,   s0:1.0, s1:1.08,x0:0,y0:0,x1:-25,y1:0,   blend:'screen',bg:'title',from:'right',fade:0},
];
const CUTS = [4.5,8.5,10.6,13.2,14.6,16.0,17.2,18.3,19.4,20.4,21.4,22.3,23.3,24.2,25.5,26.1];
const RINGS = [ {t:9.3,c:'168,110,255'}, {t:10.7,c:'90,255,110'}, {t:12.0,c:'90,255,110'}, {t:13.2,c:'77,232,255'},
                {t:14.6,c:'168,110,255'}, {t:19.4,c:'168,110,255'}, {t:20.4,c:'168,110,255'}, {t:26.1,c:'168,110,255'} ];

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,k)=>a+(b-a)*k;
const outE=x=>1-Math.pow(1-x,3), outX=x=>x>=1?1:1-Math.pow(2,-10*x), inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(s){return()=>{s|=0;s=(s+0x6d2b79f5)|0;let r=Math.imul(s^(s>>>15),1|s);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296}}

const imgs = SHOTS.map(s=>{const i=new Image();i.className='shot';i.src=A(s.n);document.getElementById('stage').appendChild(i);return i});
const bg=document.getElementById('bg'), flash=document.getElementById('flash'), fade=document.getElementById('fade');
const lines=document.getElementById('lines').getContext('2d'), fx=document.getElementById('fx').getContext('2d');
const tb=document.getElementById('titlebox'), mr=document.getElementById('mr'), xx=document.getElementById('x'), tag=document.getElementById('tag');
tag.textContent=TITLE_TAG;

const BG={
  lab:'#05030c',
  comic:'radial-gradient(circle at 50% 60%,#fff 0,#ece6ff 55%,#c9b8ff 100%)',
  purple:'radial-gradient(circle at 50% 50%,#3b1580 0,#12062b 55%,#030108 100%)',
  green:'radial-gradient(circle at 50% 50%,#0f5a1c 0,#052a0b 55%,#010501 100%)',
  black:'#000',
  mont:'radial-gradient(circle at 50% 50%,#2a0f5c 0,#0c0420 60%,#020108 100%)',
  title:'radial-gradient(circle at 78% 50%,#2a0f5c 0,#0a0318 45%,#000 100%)',
};

function speedLines(t,inten,col){
  lines.clearRect(0,0,1920,1080); if(inten<=0) return;
  const r=rng(Math.floor(t*14)+7), cx=960, cy=540, n=70;
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2, r0=380+r()*320, len=160+r()*520, w=2+r()*7;
    lines.strokeStyle=`rgba(${col},${(.25+r()*.5)*inten})`; lines.lineWidth=w; lines.beginPath();
    lines.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.75);
    lines.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len)*.75); lines.stroke();
  }
}
function rings(t){
  fx.clearRect(0,0,1920,1080);
  for(const g of RINGS){
    const u=(t-g.t)/0.9; if(u<0||u>1) continue;
    const e=outE(u);
    for(let j=0;j<3;j++){
      const uu=clamp(u-j*.08)/(1-j*.08); if(uu<=0) continue; const ee=outE(uu);
      fx.strokeStyle=`rgba(${g.c},${(1-uu)*.9})`; fx.lineWidth=26*(1-uu)+2;
      fx.beginPath(); fx.ellipse(960,540,80+ee*1100,(80+ee*1100)*.55,0,0,7); fx.stroke();
    }
  }
}

window.DURATION=DURATION;
window.seek=function(t){
  // active shot
  let active=-1;
  SHOTS.forEach((s,i)=>{ if(t>=s.t0&&t<s.t1) active=i; });
  imgs.forEach((im,i)=>{
    const s=SHOTS[i];
    if(i!==active){im.style.display='none';return}
    const u=(t-s.t0)/(s.t1-s.t0), lt=t-s.t0;
    let sc=lerp(s.s0,s.s1,u), x=lerp(s.x0,s.x1,u), y=lerp(s.y0,s.y1,u), op=1;
    const e=clamp(lt/0.22);
    if(s.from==='left') x-=(1-outX(e))*420; else if(s.from==='right') x+=(1-outX(e))*420;
    else if(s.from==='top') y-=(1-outX(e))*320; else if(s.from==='bottom') y+=(1-outX(e))*320;
    else if(s.from==='zoom') sc*=1+(1-outX(e))*0.35;
    if(s.shake){const a=s.shake*Math.exp(-lt*9), r=rng(Math.floor(t*30)*13+i);x+=(r()-.5)*2*a;y+=(r()-.5)*2*a}
    if(s.fade){op=clamp(lt/s.fade)}
    if(s.n==='lab'){op=clamp(t/1.0)}
    let filt='';
    if(s.eyes){const p=.5+.5*Math.sin(t*14); filt=`brightness(${1.05+p*.45}) saturate(${1.1+p*.5})`}
    if(s.n==='green'){filt=`brightness(${1+.12*Math.sin(t*10)})`}
    im.style.display='block'; im.style.opacity=op; im.style.filter=filt;
    im.style.mixBlendMode=s.blend||'normal';
    im.style.transform=`translate(${x}px,${y}px) scale(${sc})`;
  });
  const s=SHOTS[active]; bg.style.background=s?BG[s.bg]:'#000';
  // lab: neon X pulse on whole-frame tint near the end of the act
  // speed lines
  const montage=t>=14.6&&t<25.5, power=t>=8.5&&t<14.6;
  speedLines(t, montage?1: (t>=10.6&&t<13.2?.8:0), t>=10.6&&t<13.2?'110,255,130':'170,120,255');
  rings(t);
  // flash on cuts
  let f=0,fc='255,255,255';
  for(const c of CUTS){const d=t-c; if(d>=0&&d<.2){const v=(1-d/.2)*.85; if(v>f){f=v; fc=(c>=14.6&&c<26)?'190,150,255':'255,255,255'}}}
  if(t>=13.2&&t<13.45){f=Math.max(f,(1-(t-13.2)/.25)*1.0); fc='160,255,255'}
  if(t>=8.4&&t<8.6){f=Math.max(f,1-Math.abs(t-8.5)/.1)}
  flash.style.background=`rgb(${fc})`; flash.style.opacity=f;
  // title
  const tt=t-26.5;
  if(tt>=0){
    tb.style.opacity=1;
    const a=clamp(tt/0.45), b=clamp((tt-0.35)/0.45);
    const sa=1+(1-outX(a))*2.2, sb=1+(1-outX(b))*2.2;
    mr.style.transform=`scale(${sa})`; mr.style.opacity=clamp(a*3);
    xx.style.transform=`scale(${sb})`; xx.style.opacity=clamp(b*3);
    const glow=.5+.5*Math.sin(t*3); xx.style.filter=`drop-shadow(0 0 ${20+glow*30}px rgba(150,90,255,.9))`;
    tag.style.opacity=clamp((tt-1.1)/0.6); tag.style.transform=`translateX(${(1-outX(clamp((tt-1.1)/0.8)))*-60}px)`;
    if(tt>0.35&&tt<0.6){const r=rng(Math.floor(t*30));xx.style.marginLeft=(30+(r()-.5)*24)+'px'} else xx.style.marginLeft='30px';
  } else tb.style.opacity=0;
  fade.style.opacity = t>33?clamp((t-33)/1.0):0;
};
const q=new URLSearchParams(location.search);
if(q.get('capture')!=='1'){
  const go=()=>{ if(q.get('t')){seek(parseFloat(q.get('t')));return}
    const t0=performance.now(); (function f(){seek(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(f)})() };
  Promise.all(imgs.map(i=>i.decode().catch(()=>0))).then(go);
  const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`scale(${s})`};fit();addEventListener('resize',fit);
}
</script></body></html>
