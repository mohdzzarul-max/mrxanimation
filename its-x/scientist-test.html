<!doctype html>
<html><head><meta charset="utf-8"><title>IT'S X! Scientist Test</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; transform-origin: 0 0; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * IT'S X! - 5-second acting test: the pre-mask scientist drops violet liquid into a flask,
 * sees an odd pulse, raises one eyebrow, then takes a half-step back.
 *
 * Cut-out rig drawn in code (no bitmaps of the character). State is a pure function of time:
 * window.seek(t) draws the frame for second t, so effects/render.js can capture it frame by frame.
 * Music: assets/track_35.74-40.74.m4a (song 35.74s-40.74s). Times below are local to that cut.
 *
 * Coordinates: "world" = the lab background at 1920x1080. The character is designed in CU
 * (character units) and placed in world at scale CS. The camera maps world to screen.
 */
window.STAGE_W = 1920; window.STAGE_H = 1080;
const DURATION = 5;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const P = new URLSearchParams(location.search);

// ---------------- palette (from the approved character sheets) ----------------
const INK = '#120f18';
const SKIN = '#f4c8a2', SKIN_S = '#d99a75';
const HAIR = '#17151f', HAIR_H = '#3d3a5c';
const SHIRT = '#1b1923', SHIRT_H = '#33304a';
const COAT = '#f3f1f8', COAT_S = '#c3bdd8';
const BAND = '#141219';
const IRIS = '#9ea5b2', IRIS_D = '#5c6271', PUPIL = '#1b1822';
const VIOLET = '#8a4dff';

// ---------------- maths / easing ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x,
  out: x => 1 - (1 - x) * (1 - x),
  inOut: x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  back: x => { const s = 1.9; x -= 1; return x * x * ((s + 1) * x + s) + 1; }, // overshoot
};
// keyframe track: [[time, value, easeIntoThisKey], ...]
function tr(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) {
      const [t0, v0] = keys[i - 1];
      return lerp(v0, v1, E[e || 'inOut']((t - t0) / (t1 - t0)));
    }
  }
  return keys[keys.length - 1][1];
}
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
}
// damped spring following a driver; simulated from 0 so the result depends only on t
function spring(driver, t, k = 120, damp = 9) {
  let y = driver(0), v = 0; const dt = 1 / 240;
  for (let s = 0; s < t; s += dt) { const a = k * (driver(s) - y) - damp * v; v += a * dt; y += v * dt; }
  return y;
}

// ---------------- drawing helpers ----------------
function poly(p) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); }
// closed smooth curve through points (midpoint quadratics)
function blob(p) {
  const n = p.length / 2, X = i => p[(i % n) * 2], Y = i => p[(i % n) * 2 + 1];
  ctx.beginPath(); ctx.moveTo((X(0) + X(1)) / 2, (Y(0) + Y(1)) / 2);
  for (let i = 1; i <= n; i++) ctx.quadraticCurveTo(X(i), Y(i), (X(i) + X(i + 1)) / 2, (Y(i) + Y(i + 1)) / 2);
  ctx.closePath();
}
function stroke(lw = 5, col = INK) { ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.stroke(); }
// fill a shape, add a hard cel shadow clipped inside it, then ink the outline
function shape(build, fill, shade, shadeCol, lw = 5) {
  build(); ctx.fillStyle = fill; ctx.fill();
  if (shade) { ctx.save(); build(); ctx.clip(); shade(); ctx.fillStyle = shadeCol; ctx.fill(); ctx.restore(); }
  build(); stroke(lw);
}
const P2 = pts => () => poly(pts), B2 = pts => () => blob(pts);
// capsule limb from A to B with widths wa, wb; shade on one side
function limb(A, B, wa, wb, fill, shadeCol, side = 1, lw = 5) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const build = () => {
    ctx.beginPath();
    ctx.moveTo(A[0] + nx * wa / 2, A[1] + ny * wa / 2); ctx.lineTo(B[0] + nx * wb / 2, B[1] + ny * wb / 2);
    ctx.arc(B[0], B[1], wb / 2, Math.atan2(ny, nx), Math.atan2(ny, nx) + Math.PI * (dx * ny - dy * nx > 0 ? -1 : 1), true);
    ctx.lineTo(A[0] - nx * wa / 2, A[1] - ny * wa / 2);
    ctx.arc(A[0], A[1], wa / 2, Math.atan2(-ny, -nx), Math.atan2(-ny, -nx) + Math.PI, true);
    ctx.closePath();
  };
  shape(build, fill, () => poly([A[0], A[1], B[0], B[1], B[0] + side * nx * wb, B[1] + side * ny * wb, A[0] + side * nx * wa, A[1] + side * ny * wa]), shadeCol, lw);
}
function pill(x1, y1, x2, y2, w, fill) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.lineCap = 'round'; ctx.lineWidth = w + 10; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = fill; ctx.stroke();
}
// 2-bone IK: shoulder S, wrist target T, lengths a,b; bend = +1/-1 picks the elbow side
function ik(S, T, a, b, bend) {
  let dx = T[0] - S[0], dy = T[1] - S[1], d = Math.hypot(dx, dy);
  const dd = clamp(d, Math.abs(a - b) + 1, a + b - 0.5);
  const base = Math.atan2(dy, dx), off = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1)) * bend;
  const E_ = [S[0] + Math.cos(base + off) * a, S[1] + Math.sin(base + off) * a];
  const W = [S[0] + Math.cos(base) * dd, S[1] + Math.sin(base) * dd];
  return [E_, W];
}

// ---------------- background ----------------
const bgImg = new Image(); bgImg.src = 'assets/lab_bg.jpg';
const bgReady = new Promise(r => { bgImg.onload = r; bgImg.onerror = r; });
let bgSoft = null;
function bgLayer() {
  if (bgSoft) return bgSoft;
  bgSoft = document.createElement('canvas'); bgSoft.width = 1920; bgSoft.height = 1080;
  const b = bgSoft.getContext('2d'); b.filter = 'blur(1.1px)'; b.drawImage(bgImg, 0, 0, 1920, 1080);
  b.filter = 'none'; b.fillStyle = 'rgba(20,10,45,0.16)'; b.fillRect(0, 0, 1920, 1080); // push it back a touch
  return bgSoft;
}
function rain(t) {
  ctx.save(); ctx.beginPath(); ctx.rect(1338, 112, 300, 476); ctx.rect(1655, 112, 265, 476); ctx.clip();
  const R = rng(5); ctx.strokeStyle = 'rgba(170,215,255,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 70; i++) {
    const x0 = 1330 + R() * 640, sp = 900 + R() * 400, ph = R();
    const y = ((ph + t * sp / 600) % 1) * 640 + 60, x = x0 - (y - 60) * 0.28;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9, y + 30); ctx.stroke();
  }
  ctx.restore();
}

// the rack sits on the near desk, so it must cover his body: re-draw just its pixels from the background
function rackOccluder() {
  ctx.save(); ctx.beginPath();
  ctx.rect(1418, 876, 256, 34);   // base plate
  ctx.rect(1418, 776, 256, 20);   // top bar
  ctx.rect(1420, 776, 18, 120); ctx.rect(1654, 776, 18, 120); // end posts
  [1448, 1496, 1543, 1591].forEach(x => ctx.roundRect(x, 750, 44, 154, 18)); // tubes
  ctx.clip(); ctx.drawImage(bgLayer(), 0, 0); ctx.restore();
}

// ---------------- the flask (redrawn over the background's flask so it can glow) ----------------
const FX = 1765, SURF = 830;
function flaskBody() {
  ctx.beginPath(); ctx.moveTo(1738, 708); ctx.lineTo(1792, 708); ctx.lineTo(1792, 766);
  ctx.lineTo(1862, 884); ctx.quadraticCurveTo(1872, 916, 1840, 917); ctx.lineTo(1690, 917);
  ctx.quadraticCurveTo(1658, 916, 1668, 884); ctx.lineTo(1738, 766); ctx.closePath();
}
function drawFlask(t, I, wob) {
  flaskBody(); ctx.fillStyle = '#2b2452'; ctx.fill();
  // liquid
  ctx.save(); flaskBody(); ctx.clip();
  const sy = SURF + wob;
  const g = ctx.createLinearGradient(0, sy, 0, 917);
  g.addColorStop(0, mix('#8d55ff', '#e2c4ff', I)); g.addColorStop(1, mix('#5a22d6', '#a86bff', I));
  ctx.beginPath(); ctx.moveTo(1600, sy);
  for (let x = 1600; x <= 1930; x += 10) ctx.lineTo(x, sy + Math.sin(x * 0.07 - t * 14) * wob * 0.35);
  ctx.lineTo(1930, 930); ctx.lineTo(1600, 930); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  // surface ellipse
  ctx.beginPath(); ctx.ellipse(FX, sy, 64, 9, 0, 0, Math.PI * 2); ctx.fillStyle = mix('#b48cff', '#ffffff', I * 0.8); ctx.fill();
  // bubbles once it starts reacting
  const R = rng(21), nb = Math.floor(clamp(I * 1.4) * 16);
  for (let i = 0; i < 16; i++) {
    const bx = 1700 + R() * 130, sp = 70 + R() * 90, ph = R(), r = 3 + R() * 6;
    if (i >= nb) continue;
    const y = 912 - ((ph + t * sp / 90) % 1) * (912 - sy);
    ctx.beginPath(); ctx.arc(bx, y, r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,240,255,0.75)'; ctx.fill();
  }
  ctx.restore();
  // glass shine + rim + outlines
  ctx.save(); flaskBody(); ctx.clip();
  poly([1748, 712, 1758, 712, 1758, 770, 1700, 880, 1688, 880, 1748, 770]); ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
  ctx.restore();
  flaskBody(); stroke(4, '#e6e1ff');
  flaskBody(); ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.globalCompositeOperation = 'destination-over'; ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.roundRect(1728, 694, 74, 16, 5); ctx.fillStyle = '#d9d3f2'; ctx.fill(); stroke(5);
}
function mix(a, b, k) {
  k = clamp(k); const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// ---------------- performance tracks (local seconds; music beats every ~0.497s) ----------------
const T = {
  lean:   [[0, 0.05], [1.2, 0.05], [1.62, 0.085], [2.3, 0.07], [3.0, 0.07], [3.45, 0.1], [3.66, 0.11], [3.86, -0.075, 'out'], [4.02, -0.09, 'out'], [4.35, -0.062], [5, -0.066]],
  rootX:  [[0, 0], [3.0, 0], [3.45, 6], [3.66, 9], [3.95, -74, 'out'], [4.18, -64], [5, -66]],
  rootY:  [[0, 0], [3.6, 0], [3.68, 7, 'out'], [3.82, -11, 'out'], [3.97, 4], [4.16, 0]],
  lift:   [[0, 0], [3.7, 0], [3.86, 18, 'out'], [4.02, 21], [4.45, 11], [5, 10]],
  headA:  [[0, 0.17], [1.2, 0.17], [1.62, 0.22], [2.14, 0.13], [2.36, 0.17], [2.55, 0.11, 'out'], [3.0, 0.08], [3.22, -0.07, 'out'], [3.5, -0.02], [3.68, 0.05], [3.86, -0.17, 'out'], [4.06, -0.12], [5, -0.11]],
  headX:  [[0, 0], [3.0, 0], [3.4, 7], [3.68, 9], [3.9, -16, 'out'], [5, -12]],
  lookX:  [[0, 0.55], [2.4, 0.55], [2.58, 0.8, 'out'], [3.6, 0.8], [3.8, 0.55], [5, 0.55]],
  lookY:  [[0, 0.75], [1.6, 0.85], [2.3, 0.75], [2.58, 0.45, 'out'], [3.6, 0.4], [3.8, 0.15, 'out'], [5, 0.2]],
  lid:    [[0, 0.6], [1.3, 0.52], [1.66, 0.48], [2.0, 0.64], [2.55, 0.88, 'out'], [2.79, 0.88], [2.84, 0.0, 'in'], [2.92, 0.0], [2.98, 0.94, 'out'], [3.62, 0.9], [3.8, 1.28, 'out'], [5, 1.22]],
  browN:  [[0, -0.45], [2.5, -0.45], [2.7, -0.1, 'out'], [3.6, -0.3], [3.8, 1.1, 'out'], [5, 1.0]],
  browF:  [[0, -0.45], [2.5, -0.45], [2.7, -0.1, 'out'], [3.0, -0.1], [3.16, 1.05, 'out'], [3.6, 0.95], [3.8, 1.35, 'out'], [5, 1.25]],
  mOpen:  [[0, 0], [3.72, 0], [3.84, 1, 'out'], [4.3, 0.72], [5, 0.68]],
  mSkew:  [[0, 0], [3.0, 0], [3.16, 1, 'out'], [3.66, 1], [3.76, 0]],
  mPurse: [[0, 1], [2.0, 1], [2.3, 0.3], [3.7, 0.3], [3.8, 0]],
  tilt:   [[0, 0], [1.2, 0], [1.6, 0.2], [2.2, 0.2], [2.55, 0.12], [3.7, 0.12], [3.9, -0.24, 'out'], [5, -0.2]],
  gripX:  [[0, 0], [3.7, 0], [3.92, -80, 'back'], [4.25, -70], [5, -70]],
  gripY:  [[0, 0], [3.7, 0], [3.92, -100, 'back'], [4.25, -88], [5, -88]],
  squeeze:[[0, 0], [1.42, 0], [1.6, 1, 'out'], [1.76, 1], [1.98, 0]],
  nearX:  [[0, -70], [3.72, -70], [3.95, 6, 'back'], [4.3, 0], [5, 0]],
  nearY:  [[0, -40], [3.72, -40], [3.95, -268, 'back'], [4.3, -252], [5, -254]],
  nearRot:[[0, 0], [3.72, 0], [3.95, 0.25, 'out'], [5, 0.2]],
  camZ:   [[0, 1.5], [3.6, 1.545], [3.75, 1.548], [3.96, 1.525, 'out'], [5, 1.53]],
  camX:   [[0, 1276], [3.6, 1290], [5, 1288]],
  camY:   [[0, 702], [3.6, 690], [5, 693]],
};
// violet reaction intensity: pulses on the beats at 2.50, 2.99, then swells to "glow" (3.72)
function intensity(t) {
  const bump = (c, a, w) => a * Math.exp(-Math.pow((t - c) / w, 2));
  let I = bump(2.5, 0.35, 0.1) + bump(2.99, 0.55, 0.11);
  if (t > 3.4) I += clamp((t - 3.4) / 0.32) ** 2 * 1.0 * (t < 3.72 ? 1 : lerp(1, 0.55, clamp((t - 3.72) / 0.9)));
  I += bump(4.46, 0.25, 0.1) + bump(4.95, 0.2, 0.1);
  return clamp(I, 0, 1.2);
}

// ---------------- the scientist ----------------
const ROOT = [1509, 941], CS = 1 / 1.3, DESK_Y = 858;
const FLASK_TIP = [(FX - ROOT[0]) / CS, (690 - ROOT[1]) / CS]; // pipette tip target in CU

function drawScientist(t, tc) {
  const v = k => tr(T[k], tc);
  const lean = v('lean'), rx = v('rootX'), ry = v('rootY'), lift = v('lift');
  const sc = CS * (1 + rx * 0.00035);
  // world transform for the character
  ctx.save(); ctx.translate(ROOT[0], ROOT[1]); ctx.scale(sc, sc); ctx.translate(rx, ry);
  const cos = Math.cos(lean), sin = Math.sin(lean);
  const TL = (x, y) => [x * cos - y * sin, x * sin + y * cos]; // torso-local -> CU
  // secondary motion: hair and coat lag behind head angle and body travel
  const lagHead = spring(s => tr(T.headA, s) + tr(T.rootX, s) * 0.004, tc, 90, 7) - (v('headA') + rx * 0.004);
  const lagBody = spring(s => tr(T.rootX, s), tc, 110, 8) - rx;

  // ---- far arm (his left) holding the pipette over the flask: drawn behind the torso ----
  const th = v('tilt');
  const d = [Math.sin(th), Math.cos(th)];
  const tip = [FLASK_TIP[0] - rx + v('gripX'), FLASK_TIP[1] - ry + v('gripY')];
  const grip = [tip[0] - d[0] * 150, tip[1] - d[1] * 150];
  const tremor = Math.sin(t * 23) * 0.6;
  const wristF = [grip[0] - 26 + tremor, grip[1] + 4];
  const shF = TL(76, -374 - lift);
  const [elF, wF] = ik(shF, wristF, 168, 150, 1);
  limb(shF, elF, 50, 44, COAT, COAT_S, -1);
  limb(elF, wF, 44, 36, COAT, COAT_S, -1);
  drawPipette(grip, th, v('squeeze'), t);
  wristband(elF, wF);
  gripHand(wF, 0, v('squeeze'));

  // ---- torso, neck, head (clipped at the desk edge: he stands behind the desk) ----
  ctx.save();
  ctx.beginPath(); ctx.rect(-5000, -5000, 10000, 5000 + (DESK_Y - ROOT[1]) / sc - ry); ctx.clip();
  ctx.save(); ctx.rotate(lean);
  drawTorso(lift, lagBody);
  // neck + head
  shape(P2([-24, -452, 16, -452, 20, -396, -26, -396]), SKIN, P2([-30, -460, 22, -460, 22, -430, -30, -418]), SKIN_S);
  ctx.save(); ctx.translate(4 + v('headX'), -422 - lift * 0.6); ctx.rotate(v('headA') - lean * 0.6);
  drawHead(v, lagHead, t, tc);
  ctx.restore();
  ctx.restore();
  ctx.restore();

  // ---- near arm (his right): hangs out of sight behind the desk, flies up open-palmed on the surprise ----
  ctx.save(); ctx.beginPath(); ctx.rect(-5000, -5000, 10000, 5000 + (DESK_Y - ROOT[1]) / sc - ry); ctx.clip();
  const shN = TL(-94, -372 - lift);
  const wristN = [v('nearX') - rx * 0.15, v('nearY') - ry];
  const [elN, wN] = ik(shN, wristN, 168, 150, 1);
  limb(shN, elN, 52, 46, COAT, COAT_S, 1);
  limb(elN, wN, 46, 38, COAT, COAT_S, 1);
  wristband(elN, wN);
  const handPose = tc < 3.74 ? 'rest' : tc < 3.8 ? 'half' : 'open';
  nearHand(wN, handPose, v('nearRot'));
  ctx.restore();
  ctx.restore();
}

function wristband(E_, W) {
  const dx = W[0] - E_[0], dy = W[1] - E_[1], L = Math.hypot(dx, dy);
  const a = [W[0] - dx / L * 30, W[1] - dy / L * 30];
  limb(a, [W[0] - dx / L * 6, W[1] - dy / L * 6], 40, 38, BAND, '#000', 1, 4);
  // coat cuff edge overlapping the band
  limb([a[0] - dx / L * 10, a[1] - dy / L * 10], [a[0] + dx / L * 2, a[1] + dy / L * 2], 47, 46, COAT, COAT_S, 1, 4);
}

function drawTorso(lift, lag) {
  const sw = clamp(lag * 0.25, -14, 14); // coat front sways with travel
  const L = lift;
  // black t-shirt
  shape(P2([-84, -392 - L, -30, -410 - L, 22, -410 - L, 70, -394 - L, 88, -330, 84, -220, 78, -60, 72, 40, -82, 40, -86, -120, -92, -260, -98, -340]),
    SHIRT, P2([30, -400, 90, -400, 90, 40, 52, 40, 48, -200]), '#121018');
  ctx.beginPath(); ctx.moveTo(14, -360); ctx.quadraticCurveTo(30, -250, 22, -120); stroke(3, SHIRT_H);
  // far coat panel (turned away, mostly in shadow)
  shape(P2([36, -408 - L, 76, -396 - L, 98, -338, 94, -200, 96 + sw, 40, 44 + sw, 40, 40, -140, 46, -280, 52, -336]),
    COAT, P2([30, -420, 64, -420, 60, -200, 62 + sw, 40, 30, 40]), COAT_S);
  // near coat panel
  shape(P2([-110, -380 - L, -66, -402 - L, -30, -414 - L, -18, -340, -6, -240, 0, -120, 2 + sw, 40, -114 + sw, 40, -118, -140, -120, -280]),
    COAT, P2([-40, -330, -18, -340, -6, -240, 0, -120, 2 + sw, 40, -30 + sw, 40, -30, -150]), COAT_S);
  // chest pocket with pens
  pill(-86, -322, -86, -298, 6, '#22202c'); pill(-72, -326, -72, -298, 6, '#7a4fd6');
  shape(P2([-100, -302, -52, -304, -50, -262, -98, -260]), COAT, null, null, 4);
  // lapels
  shape(P2([-36, -416 - L, -12, -406 - L, -4, -312, -20, -294, -30, -352]), COAT, P2([-20, -400, -4, -400, -4, -300, -20, -294]), COAT_S, 4);
  shape(P2([30, -412 - L, 52, -404 - L, 54, -330, 44, -300]), COAT, null, null, 4);
}

function drawHead(v, lag, t, tc) {
  // face
  const face = [-58, -20, -74, -80, -70, -150, -40, -195, 15, -205, 58, -178, 76, -132, 81, -98, 77, -74, 72, -52, 56, -22, 30, -2, 10, 0, -24, -6];
  shape(B2(face), SKIN, P2([-80, 0, -80, -160, -36, -150, -26, -90, -34, -50, -10, -10, -10, 10]), SKIN_S);
  // under-chin shadow line
  ctx.beginPath(); ctx.moveTo(40, -10); ctx.quadraticCurveTo(20, 2, 0, -2); stroke(3, SKIN_S);
  // hair (spiky mass with bangs), then tuft, then ear on top of the back hair
  const hair = [-56, -24, -86, -48, -76, -70, -104, -96, -84, -112, -110, -150, -82, -160, -98, -194, -66, -198, -58, -224, -26, -212, -2, -232,
    18, -214, 44, -222, 56, -202, 90, -194, 80, -176, 104, -150, 82, -146, 96, -116, 70, -128, 64, -106, 50, -136, 36, -112, 24, -142, 6, -120,
    -6, -148, -20, -138, -26, -110, -30, -80, -40, -62, -48, -80, -52, -50];
  shape(P2(hair), HAIR, P2([-10, -250, 60, -250, 40, -200, 0, -180]), HAIR_H);
  // highlight streaks
  poly([-60, -180, -30, -205, -40, -190]); ctx.fillStyle = HAIR_H; ctx.fill();
  poly([10, -205, 40, -215, 26, -200]); ctx.fill();
  // the single curved tuft (lags behind head turns)
  const a = clamp(-lag * 1.6, -0.5, 0.5) + Math.sin(t * 3.1) * 0.03;
  drawTuft(a);
  // ear
  ctx.beginPath(); ctx.ellipse(-38, -92, 13, 21, -0.15, 0, Math.PI * 2); ctx.fillStyle = SKIN; ctx.fill(); stroke(4);
  ctx.beginPath(); ctx.moveTo(-34, -104); ctx.quadraticCurveTo(-44, -94, -36, -80); stroke(3, SKIN_S);

  // eyes
  const lid = v('lid'), lx = v('lookX'), ly = v('lookY');
  eye(16, -104, 46, 27, lid, lx, ly, false);
  eye(66, -106, 25, 26, lid, lx, ly, true);
  // brows: near (furrow/raise), far (the single raised eyebrow)
  brow(-6, -128, 40, -134, v('browN'), 9);
  brow(54, -134, 80, -132, v('browF'), 7);
  // nose
  shape(P2([78, -100, 93, -77, 80, -72]), SKIN, null, null, 4);
  // mouth
  mouth(v('mOpen'), v('mSkew'), v('mPurse'));
}

function drawTuft(a) {
  // centre-line: quadratic from the crown, up and curling back; width tapers
  const p0 = [-4, -222], p1 = [26, -298], p2 = [-30, -306];
  const rot = (p) => { const x = p[0] - p0[0], y = p[1] - p0[1]; return [p0[0] + x * Math.cos(a) - y * Math.sin(a), p0[1] + x * Math.sin(a) + y * Math.cos(a)]; };
  const q1 = rot(p1), q2 = rot(p2), L = [], R = [];
  for (let i = 0; i <= 16; i++) {
    const s = i / 16, u = 1 - s;
    const x = u * u * p0[0] + 2 * u * s * q1[0] + s * s * q2[0], y = u * u * p0[1] + 2 * u * s * q1[1] + s * s * q2[1];
    const dx = 2 * u * (q1[0] - p0[0]) + 2 * s * (q2[0] - q1[0]), dy = 2 * u * (q1[1] - p0[1]) + 2 * s * (q2[1] - q1[1]);
    const n = Math.hypot(dx, dy), w = lerp(24, 4, s * s);
    L.push([x - dy / n * w / 2, y + dx / n * w / 2]); R.push([x + dy / n * w / 2, y - dx / n * w / 2]);
  }
  shape(P2(L.concat(R.reverse()).flat()), HAIR, null, null, 4);
}

function eye(cx, cy, w, h, open, lx, ly, far) {
  const f = far ? -1 : 1; // near eye: outer corner on the left; far eye mirrored
  const wide = Math.max(0, open - 1), o = Math.min(open, 1);
  const H = h * (1 + wide * 0.9);
  const outer = [cx - f * w / 2, cy + 3], inner = [cx + f * w / 2, cy - H * 0.08];
  const lowMid = [cx + f * w * 0.1, cy + H * 0.48];
  const closedY = cy + H * 0.2;
  const peak = [cx - f * w * 0.05, lerp(closedY, cy - H * 0.52, o)];
  const shoulder = [cx + f * w * 0.32, lerp(closedY, cy - H * 0.4, o)];
  if (o < 0.08) { // closed: a single lash curve
    ctx.beginPath(); ctx.moveTo(outer[0] - f * 4, outer[1] - 2); ctx.quadraticCurveTo(cx, cy + H * 0.36, inner[0], inner[1] + 6); stroke(6);
    return;
  }
  const white = () => { ctx.beginPath(); ctx.moveTo(...outer); ctx.lineTo(...peak); ctx.lineTo(...shoulder); ctx.lineTo(...inner);
    ctx.quadraticCurveTo(lowMid[0] + f * w * 0.2, lowMid[1], lowMid[0], lowMid[1]); ctx.quadraticCurveTo(outer[0] + f * w * 0.15, lowMid[1], outer[0], outer[1]); ctx.closePath(); };
  white(); ctx.fillStyle = '#fbfaff'; ctx.fill();
  ctx.save(); white(); ctx.clip();
  const r = h * (0.46 - wide * 0.12), ix = cx + f * 0 + lx * w * 0.22, iy = cy + ly * h * 0.22;
  ctx.beginPath(); ctx.arc(ix, iy, r, 0, Math.PI * 2); ctx.fillStyle = IRIS; ctx.fill(); stroke(3, IRIS_D);
  ctx.beginPath(); ctx.arc(ix, iy - r * 0.25, r * 0.7, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(ix, iy); ctx.fillStyle = IRIS_D; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(ix, iy, r * (0.48 - wide * 0.18), 0, Math.PI * 2); ctx.fillStyle = PUPIL; ctx.fill();
  ctx.beginPath(); ctx.arc(ix - r * 0.35, iy - r * 0.4, r * 0.24, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  // upper lid: heavy line with a flick past the outer corner
  ctx.beginPath(); ctx.moveTo(outer[0] - f * 7, outer[1] - 4); ctx.lineTo(...peak); ctx.lineTo(...shoulder); ctx.lineTo(inner[0], inner[1]); stroke(far ? 5 : 7);
  ctx.beginPath(); ctx.moveTo(lowMid[0] - f * w * 0.15, lowMid[1] - 1); ctx.lineTo(lowMid[0] + f * w * 0.2, lowMid[1] - 3); stroke(2.5);
}

function brow(x1, y1, x2, y2, raise, thick) {
  // raise > 0 lifts and arches; raise < 0 furrows (inner end pulled down)
  const up = raise * 11, inner = raise < 0 ? -raise * 7 : 0;
  const a = [x1, y1 - up * 0.8], b = [x2, y2 - up + inner];
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 5 - Math.max(0, raise) * 5];
  poly([a[0], a[1], m[0], m[1] - thick * 0.6, b[0], b[1] - thick * 0.5, b[0], b[1] + thick * 0.5, m[0], m[1] + thick * 0.5, a[0], a[1] + 2]);
  ctx.fillStyle = HAIR; ctx.fill(); stroke(2);
}

function mouth(open, skew, purse) {
  const cx = 52, cy = -40, hw = lerp(13, 9, purse);
  if (open > 0.05) {
    const h = 6 + open * 16, w2 = hw * (0.75 + open * 0.25);
    ctx.beginPath(); ctx.moveTo(cx - w2, cy - 2); ctx.quadraticCurveTo(cx, cy - 6, cx + w2, cy - 3);
    ctx.quadraticCurveTo(cx + w2 * 0.9, cy + h, cx, cy + h); ctx.quadraticCurveTo(cx - w2 * 0.9, cy + h, cx - w2, cy - 2); ctx.closePath();
    ctx.fillStyle = '#3e1521'; ctx.fill(); stroke(4);
    ctx.save(); ctx.clip(); ctx.beginPath(); ctx.ellipse(cx, cy + h, w2 * 0.6, h * 0.35, 0, 0, Math.PI * 2); ctx.fillStyle = '#c4566c'; ctx.fill(); ctx.restore();
    return;
  }
  ctx.beginPath(); ctx.moveTo(cx - hw, cy + 1 + skew * 2); ctx.quadraticCurveTo(cx, cy + 2 - skew * 2, cx + hw, cy - 1 - skew * 6); stroke(4);
}

// ---------------- hands (4 fingers + thumb every time) ----------------
function gripHand(W, rot, squeeze) {
  ctx.save(); ctx.translate(W[0], W[1]); ctx.rotate(rot);
  // back of hand
  shape(B2([-4, -14, 14, -22, 30, -20, 38, -6, 38, 14, 28, 24, 6, 22, -6, 8]), SKIN, P2([-10, 6, 40, 6, 40, 30, -10, 30]), SKIN_S, 4.5);
  // four curled fingers wrapping the pipette (in front of it)
  for (let i = 0; i < 4; i++) {
    const y = -12 + i * 9.5;
    ctx.beginPath(); ctx.roundRect(28, y, 18, 9, 4.5); ctx.fillStyle = SKIN; ctx.fill(); stroke(3.5);
  }
  // thumb pressing the bulb
  const sq = squeeze * 5;
  pill(8, -18, 26 + sq * 0.4, -32 + sq * 0.6, 9, SKIN);
  ctx.restore();
}
function nearHand(W, pose, rot) {
  ctx.save(); ctx.translate(W[0], W[1]); ctx.rotate(rot);
  if (pose === 'rest') {
    // relaxed, fingers curled down onto the desk
    shape(B2([-16, -4, 14, -6, 22, 18, 18, 34, -14, 34, -20, 16]), SKIN, P2([4, -10, 30, -10, 30, 40, 4, 40]), SKIN_S, 4.5);
    for (let i = 0; i < 4; i++) pill(-12 + i * 9, 32, -10 + i * 9.5, 44 - (i === 0 || i === 3 ? 3 : 0), 7, SKIN);
    pill(-16, 6, -26, 26, 8, SKIN); // thumb
  } else {
    const k = pose === 'half' ? 0.5 : 1;
    // palm up, fingers spread (surprise)
    shape(B2([-18, 4, 16, 4, 22, -24, 14, -40, -16, -42, -24, -20]), SKIN, P2([4, 10, 30, 10, 30, -50, 4, -50]), SKIN_S, 4.5);
    const fan = [-0.42, -0.15, 0.12, 0.38], len = [30, 38, 36, 28];
    fan.forEach((a, i) => {
      const bx = -14 + i * 9.5, by = -38;
      const aa = a * k, L = len[i] * lerp(0.6, 1, k);
      pill(bx, by, bx + Math.sin(aa) * L, by - Math.cos(aa) * L, 8, SKIN);
    });
    pill(-18, -10, -18 - Math.sin(1.0 * k) * 26, -10 - Math.cos(1.0 * k) * 18, 9, SKIN); // thumb
  }
  ctx.restore();
}

function drawPipette(G, th, squeeze, t) {
  ctx.save(); ctx.translate(G[0], G[1]); ctx.rotate(-th);
  // glass tube from just under the bulb to the tip (local +y = down the pipette)
  ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(8, -6); ctx.lineTo(3, 150); ctx.lineTo(-3, 150); ctx.closePath();
  ctx.fillStyle = 'rgba(220,226,255,0.55)'; ctx.fill(); stroke(4);
  // violet liquid inside (drains a little after the squeeze)
  const fillTop = lerp(40, 70, clamp(squeeze));
  ctx.beginPath(); ctx.moveTo(-6, fillTop); ctx.lineTo(6, fillTop); ctx.lineTo(2.4, 146); ctx.lineTo(-2.4, 146); ctx.closePath();
  ctx.fillStyle = VIOLET; ctx.fill();
  // rubber bulb (squashes)
  const sq = clamp(squeeze);
  ctx.beginPath(); ctx.ellipse(0, -30 + sq * 5, 14 + sq * 5, 26 - sq * 8, 0, 0, Math.PI * 2); ctx.fillStyle = '#3a2a58'; ctx.fill(); stroke(4);
  ctx.beginPath(); ctx.ellipse(-5, -38 + sq * 5, 4, 8 - sq * 2, 0, 0, Math.PI * 2); ctx.fillStyle = '#6a55a0'; ctx.fill();
  ctx.restore();
}

// ---------------- the drop, splash and pulse rings (world coords) ----------------
const DROP_T = 1.66, LAND_T = 1.99;
function dropFx(t, tipW) {
  if (t > 1.5 && t < DROP_T) { // drop swelling at the tip
    const r = 7 * clamp((t - 1.5) / 0.16);
    ctx.beginPath(); ctx.arc(tipW[0], tipW[1] + r, r, 0, Math.PI * 2); ctx.fillStyle = '#b07bff'; ctx.fill(); stroke(2.5);
  }
  if (t >= DROP_T && t < LAND_T) {
    const s = (t - DROP_T) / (LAND_T - DROP_T), y = lerp(tipW[1] + 7, SURF, s * s);
    ctx.beginPath(); ctx.ellipse(tipW[0], y, 6, 8 + s * 4, 0, 0, Math.PI * 2); ctx.fillStyle = '#b07bff'; ctx.fill(); stroke(2.5);
  }
}
function splashFx(t) {
  if (t < LAND_T || t > LAND_T + 0.45) return;
  const s = (t - LAND_T) / 0.45, R = rng(9);
  ctx.save(); ctx.beginPath(); ctx.rect(1600, 600, 400, 300); ctx.clip();
  for (let i = 0; i < 7; i++) {
    const vx = (R() - 0.5) * 70, vy = -90 - R() * 90;
    const x = FX + vx * s, y = SURF + vy * s + 420 * s * s;
    if (y > SURF + 4) continue;
    ctx.beginPath(); ctx.arc(x, y, 3.5 * (1 - s) + 1.5, 0, Math.PI * 2); ctx.fillStyle = '#c49bff'; ctx.fill();
  }
  ctx.restore();
}
function rings(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [[LAND_T, 0.6, 70, 0.6], [2.5, 0.7, 260, 0.35], [2.99, 0.7, 340, 0.5], [3.72, 0.9, 620, 0.7], [4.46, 0.8, 300, 0.25]].forEach(([t0, dur, R, a]) => {
    const s = (t - t0) / dur; if (s < 0 || s > 1) return;
    ctx.beginPath(); ctx.ellipse(FX, SURF + (t0 === LAND_T ? 0 : 10), R * E.out(s), R * E.out(s) * (t0 === LAND_T ? 0.14 : 0.6), 0, 0, Math.PI * 2);
    ctx.lineWidth = t0 === LAND_T ? 3 : 10 * (1 - s) + 2; ctx.strokeStyle = `rgba(190,140,255,${a * (1 - s)})`; ctx.stroke();
  });
  ctx.restore();
}
function glow(I) {
  if (I <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  let g = ctx.createRadialGradient(FX, 840, 10, FX, 840, 900);
  g.addColorStop(0, `rgba(170,110,255,${0.55 * I})`); g.addColorStop(0.35, `rgba(120,60,230,${0.28 * I})`); g.addColorStop(1, 'rgba(80,20,180,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  g = ctx.createRadialGradient(FX, 820, 5, FX, 820, 150);
  g.addColorStop(0, `rgba(255,230,255,${0.7 * I})`); g.addColorStop(1, 'rgba(255,230,255,0)');
  ctx.fillStyle = g; ctx.fillRect(1500, 600, 520, 420);
  ctx.restore();
}

// ---------------- frame ----------------
function frame(t) {
  // character animates "on twos" (12 drawings/s) like TV cartoons; the fast reaction runs on ones
  const tc = t > 3.6 && t < 4.1 ? t : Math.floor(t * 12 + 1e-6) / 12;
  const I = intensity(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#0b0818'; ctx.fillRect(0, 0, 1920, 1080);

  // camera (world -> screen), with a short shake on the "glow"
  const Z = tr(T.camZ, t); let cx = tr(T.camX, t), cy = tr(T.camY, t);
  if (t > 3.72 && t < 3.95) { const s = 1 - (t - 3.72) / 0.23, R = rng(Math.floor(t * 24)); cx += (R() - 0.5) * 6 * s; cy += (R() - 0.5) * 6 * s; }
  ctx.setTransform(Z, 0, 0, Z, 960 - cx * Z, 540 - cy * Z);

  ctx.drawImage(bgLayer(), 0, 0);
  rain(t);
  // light from the flask on the back counter
  const wob = t > LAND_T ? Math.sin((t - LAND_T) * 26) * 5 * Math.exp(-(t - LAND_T) * 5) + Math.sin(t * 9) * 1.5 * I : 0;
  drawFlask(t, I, wob);
  drawScientist(t, tc);
  rackOccluder();
  // drop position comes from the pipette tip at release time (fixed point in world)
  const tipW = [FX, 690];
  dropFx(t, tipW); splashFx(t); rings(t);
  glow(I);

  // grade: cool vignette + violet lift that grows with the reaction
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = ctx.createRadialGradient(960, 520, 380, 960, 540, 1150);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,4,24,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, 1920, 1080);
  if (t > 3.7 && t < 3.79) { ctx.fillStyle = `rgba(230,200,255,${0.35 * (1 - (t - 3.7) / 0.09)})`; ctx.fillRect(0, 0, 1920, 1080); }
}

// ---------------- runtime ----------------
window.DURATION = DURATION;
let busy = Promise.resolve();
window.seek = t => (busy = busy.then(() => bgReady).then(() => frame(clamp(t, 0, DURATION))).then(() => true));
if (P.get('capture') !== '1') {
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); c.style.transform = `scale(${s})`; };
  fit(); addEventListener('resize', fit);
  if (P.has('t')) window.seek(parseFloat(P.get('t')));
  else { const t0 = performance.now(); const loop = () => { window.seek(((performance.now() - t0) / 1000) % (DURATION + 0.5)).then(() => requestAnimationFrame(loop)); }; loop(); }
}
</script>
