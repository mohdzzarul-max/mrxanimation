<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage Absolue — Experimental Perfumery Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Inter',sans-serif; background-color:#060b08; color:#f3eed9; overflow-x:hidden; margin:0; padding:0; }
        .font-cinzel { font-family:'Cinzel',serif; }
        .font-cormorant { font-family:'Cormorant Garamond',serif; }
        @keyframes sunbeamSway {
            0%,100% { transform:rotate(-18deg) translateX(0) scaleY(1); opacity:.25; }
            50% { transform:rotate(-14deg) translateX(25px) scaleY(1.05); opacity:.45; }
        }
        .sunbeam { position:absolute; top:-20%; right:12%; width:300px; height:150%;
            background:linear-gradient(180deg,rgba(226,212,152,.35) 0%,rgba(138,168,92,.08) 60%,transparent 100%);
            filter:blur(28px); transform-origin:top right; animation:sunbeamSway 9s ease-in-out infinite; pointer-events:none; }
        .sunbeam-2 { right:32%; width:180px; animation-delay:-4s; animation-duration:12s; }
        @keyframes bottleFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
        .bottle-float { animation:bottleFloat 5.5s ease-in-out infinite; }
        #bottleTilt > * { transition:transform .35s cubic-bezier(.22,1,.36,1); }
        @keyframes mascotIdle { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-6px) scale(1.015); } }
        @keyframes mascotTalk { 0%,100% { transform:translateY(0) rotate(0); } 25% { transform:translateY(-4px) rotate(-1deg); } 75% { transform:translateY(-2px) rotate(1deg); } }
        .mascot-idle { animation:mascotIdle 4s ease-in-out infinite; }
        .mascot-talking { animation:mascotTalk .45s ease-in-out infinite; }
        @keyframes eyePulse { 0%,100% { filter:drop-shadow(0 0 6px #00f0ff); opacity:.9; } 50% { filter:drop-shadow(0 0 14px #38bdf8); opacity:1; } }
        .cyber-eyes { animation:eyePulse 2.5s ease-in-out infinite; }
        .glass-panel { background:rgba(12,22,16,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border:1px solid rgba(212,197,138,.22); box-shadow:0 20px 50px rgba(0,0,0,.65); transition:all .5s ease; }
        .speech-bubble { background:linear-gradient(145deg,rgba(16,30,22,.92),rgba(9,17,12,.95));
            border:1px solid rgba(56,189,248,.45); box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 20px rgba(56,189,248,.12); }
        .section-highlight { border-color:#38bdf8 !important; box-shadow:0 0 28px rgba(56,189,248,.28) !important; transform:scale(1.01); }
        .note-btn { transition:all .3s ease; }
        .note-btn.active { background:linear-gradient(135deg,rgba(163,184,108,.28),rgba(212,197,138,.15)); border-color:#d4c58a; box-shadow:0 0 18px rgba(163,184,108,.25); }
        @keyframes mistDrift { 0% { transform:translateX(-8%) scale(1.05); opacity:.2; } 50% { transform:translateX(8%) scale(1.1); opacity:.35; } 100% { transform:translateX(-8%) scale(1.05); opacity:.2; } }
        .mist-layer { background:radial-gradient(ellipse at center,rgba(154,184,142,.18) 0%,rgba(15,28,19,0) 70%); animation:mistDrift 16s ease-in-out infinite; }
        .caret::after { content:'▍'; margin-left:2px; color:#38bdf8; animation:blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity:0; } }
        #mistCanvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-[#a3b86c] selection:text-[#060b08]">

                <span>🎭 <span data-i18n="loadMascot">Load Mascot</span></span>

                <button id="langEn" type="button" class="px-3 py-1 rounded-full text-[#d4c58a] hover:text-white transition-all">EN</button>

        </div>

                    <text x="160" y="257" text-anchor="middle" fill="#f7f1db" font-family="Cormorant Garamond, serif" font-style="italic" font-size="24" font-weight="600" letter-spacing="1">ABSOLUE</text>

                    <text x="245" y="275" text-anchor="middle" fill="#2b2923" font-family="Inter, sans-serif" font-size="6" font-weight="500" letter-spacing="1.5" transform="rotate(-90 245 275)">55 ML</text>
                    <rect x="49" y="138" width="6" height="244" rx="3" fill="#fff" fill-opacity="0.22"/>
                    <rect x="265" y="138" width="5" height="244" rx="2.5" fill="#fff" fill-opacity="0.18"/>
                    <path d="M46 374 L 274 374 L 268 386 L 52 386 Z" fill="#fff" fill-opacity="0.25"/>
                </svg>

                    <span class="w-2 h-2 rounded-full bg-[#a3b86c] animate-ping"></span>
                    <span data-i18n="spray">Spray Mist</span>
                </button>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-4">

            <section id="card-intro" class="glass-panel rounded-2xl p-5 sm:p-6">

    $('noteName').textContent = n[0]; $('noteDesc').textContent = n[1];
    document.querySelectorAll('.note-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.note === note); });
    var glow = { top:'rgba(163,184,108,.22)', heart:'rgba(212,197,138,.25)', base:'rgba(120,90,50,.28)' };
    $('bottleGlow').style.background = glow[note];
  }
  function applyLang() {
    document.documentElement.lang = lang === 'my' ? 'ms' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (el) { var v = T[lang][el.dataset.i18n]; if (v) el.textContent = v; });
    $('langMy').className = 'px-3 py-1 rounded-full transition-all ' + (lang === 'my' ? 'bg-[#d4c58a] text-[#060b08] font-semibold' : 'text-[#d4c58a] hover:text-white');
    $('langEn').className = 'px-3 py-1 rounded-full transition-all ' + (lang === 'en' ? 'bg-[#d4c58a] text-[#060b08] font-semibold' : 'text-[#d4c58a] hover:text-white');
    $('exportBtnLabel').textContent = T[lang].exp; $('finishRecBtn').textContent = T[lang].finish;
    renderNote();
    if (!presenting) say(T[lang].idle, false);
  }
  window.setLanguage = function (l) { lang = l; applyLang(); };
  $('langMy').onclick = function () { setLanguage('my'); };
  $('langEn').onclick = function () { setLanguage('en'); };
  document.querySelectorAll('.note-btn').forEach(function (b) { b.onclick = function () { note = b.dataset.note; renderNote(); }; });

  /* ---------- images ---------- */
  function useBottle(src) { $('realBottleImg').src = src; $('realBottleWrapper').classList.remove('hidden'); $('vectorBottleSvg').classList.add('hidden'); }
  function useMascot(src) { $('realMascotImg').src = src; $('realMascotImg').classList.remove('hidden'); $('vectorMascotSvg').classList.add('hidden'); }
  $('realBottleImg').onerror = function () { $('realBottleWrapper').classList.add('hidden'); $('vectorBottleSvg').classList.remove('hidden'); };
  $('realMascotImg').onerror = function () { $('realMascotImg').classList.add('hidden'); $('vectorMascotSvg').classList.remove('hidden'); };
  useBottle('bottle.jpg'); useMascot('mascot.jpg');
  $('realMascotImg').style.objectPosition = '50% 40%';
  function fromFile(input, fn) { input.onchange = function () { var f = input.files[0]; if (f) fn(URL.createObjectURL(f)); }; }
  fromFile($('bottleUploadInput'), useBottle); fromFile($('mascotUploadInput'), useMascot);

  /* ---------- atmosphere particles ---------- */
  var ac = $('atmosphereCanvas'), actx = ac.getContext('2d'), parts = [];
  function sizeAc() { ac.width = innerWidth; ac.height = innerHeight; }
  sizeAc(); addEventListener('resize', sizeAc);
  for (var i = 0; i < 55; i++) parts.push({ x:Math.random(), y:Math.random(), r:Math.random()*2+.5, vx:(Math.random()-.5)*.0003, vy:-Math.random()*.0004-.0001, a:Math.random()*.5+.15 });
  var mist = [], mc = $('mistCanvas'), mctx = mc.getContext('2d');
  function sizeMc() { mc.width = innerWidth; mc.height = innerHeight; }
  sizeMc(); addEventListener('resize', sizeMc);
  function frame() {
    actx.clearRect(0, 0, ac.width, ac.height);
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      actx.beginPath(); actx.arc(p.x*ac.width, p.y*ac.height, p.r, 0, 6.283);
      actx.fillStyle = 'rgba(226,212,152,' + p.a + ')'; actx.fill();
    });
    mctx.clearRect(0, 0, mc.width, mc.height);
    mist = mist.filter(function (m) { return m.life > 0; });
    mist.forEach(function (m) {
      m.x += m.vx; m.y += m.vy; m.vx *= .985; m.r += .6; m.life -= 1;
      mctx.beginPath(); mctx.arc(m.x, m.y, m.r, 0, 6.283);
      mctx.fillStyle = 'rgba(230,236,210,' + (m.life/m.max*.12) + ')'; mctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();

  /* ---------- spray + tilt ---------- */
  function spray() {
    var el = $('realBottleWrapper').classList.contains('hidden') ? $('vectorBottleSvg') : $('realBottleWrapper');
    var r = el.getBoundingClientRect(), ox = r.left + r.width/2, oy = r.top + r.height*.12;
    for (var i = 0; i < 70; i++) {
      var ang = -Math.PI/2 + (Math.random()-.5)*1.4, sp = Math.random()*4+1.5, life = 60 + Math.random()*50;
      mist.push({ x:ox, y:oy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp*.7, r:Math.random()*8+4, life:life, max:life });
    }
    var g = $('bottleGlow'); g.style.transform = 'scale(1.25)'; setTimeout(function () { g.style.transform = ''; }, 500);
  }
  $('sprayBtn').onclick = function (e) { e.stopPropagation(); spray(); };
  $('bottleTilt').addEventListener('click', function (e) { if (e.target.closest('#sprayBtn')) return; spray(); });
  var tilt = $('bottleTilt');
  tilt.addEventListener('mousemove', function (e) {
    var r = tilt.getBoundingClientRect(), x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
    [$('realBottleWrapper'), $('vectorBottleSvg')].forEach(function (el) { el.style.transform = 'perspective(700px) rotateY(' + x*14 + 'deg) rotateX(' + (-y*10) + 'deg)'; });
  });
  tilt.addEventListener('mouseleave', function () { [$('realBottleWrapper'), $('vectorBottleSvg')].forEach(function (el) { el.style.transform = ''; }); });

  /* ---------- mascot speech ---------- */
  var typeTimer = null, speakTimer = null;
  function say(text, speak) {
    clearInterval(typeTimer); clearTimeout(speakTimer);
    var el = $('mascotText'), box = $('mascotAvatarBox'), i = 0;
    el.textContent = ''; el.classList.add('caret'); box.classList.remove('mascot-idle'); box.classList.add('mascot-talking');
    typeTimer = setInterval(function () {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(typeTimer); el.classList.remove('caret'); speakTimer = setTimeout(function () { box.classList.remove('mascot-talking'); box.classList.add('mascot-idle'); }, 400); }
    }, 22);
    if (speak && window.speechSynthesis) {
      try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = lang === 'my' ? 'ms-MY' : 'en-US'; u.rate = 1.1; speechSynthesis.speak(u); } catch (e) {}
    }
  }
  function highlight(id) {
    ['stage-bottle','card-notes','card-details','card-intro'].forEach(function (s) { $(s).classList.toggle('section-highlight', s === id); });
  }

  /* ---------- presentation (5 steps x 4.4 s = 22 s) ---------- */
  var presenting = false, timers = [], STEP = 4400;
  function stopPresent() {
    presenting = false; timers.forEach(clearTimeout); timers = []; highlight(null);
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
    $('presentLabel').textContent = T[lang].present;
  }
  function startPresent(done) {
    stopPresent(); presenting = true; $('presentLabel').textContent = '■';
    var steps = [
      ['stage-bottle','s1',null], ['card-notes','s2','top'], ['card-notes','s3','heart'], ['card-notes','s4','base'], ['card-intro','s5',null]
    ];
    steps.forEach(function (s, i) {
      timers.push(setTimeout(function () {
        highlight(s[0]); if (s[2]) { note = s[2]; renderNote(); } say(T[lang][s[1]], true);
        if (i === 0 || i === 4) spray();
      }, i * STEP));
    });
    timers.push(setTimeout(function () { stopPresent(); say(T[lang].idle, false); if (done) done(); }, steps.length * STEP + 600));
  }
  $('presentBtn').onclick = function () { if (presenting) { stopPresent(); say(T[lang].idle, false); } else startPresent(); };

  /* ---------- video export (records this tab) ---------- */
  var rec = null, chunks = [];
  function finishRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
  $('finishRecBtn').onclick = function () { finishRec(); };
  $('exportVideoBtn').onclick = async function () {
    if (rec) return;
    try {
      var stream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:30 }, audio:false, preferCurrentTab:true });
      var types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
      var mime = types.find(function (t) { return window.MediaRecorder && MediaRecorder.isTypeSupported(t); }) || '';
      rec = new MediaRecorder(stream, mime ? { mimeType:mime, videoBitsPerSecond:6e6 } : {}); chunks = [];
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var type = rec.mimeType || 'video/webm', blob = new Blob(chunks, { type:type }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'sage-absolue.' + (type.indexOf('mp4') > -1 ? 'mp4' : 'webm'); a.click();
        rec = null; stopPresent(); $('recordingBanner').classList.add('hidden'); $('recordingStatusText').textContent = T[lang].recDone;
      };
      stream.getVideoTracks()[0].onended = finishRec;
      $('recordingStatusText').textContent = T[lang].rec; $('recordingBanner').classList.remove('hidden');
      rec.start(); startPresent(function () { setTimeout(finishRec, 500); });
    } catch (e) {
      rec = null; $('recordingStatusText').textContent = T[lang].recFail; $('recordingBanner').classList.remove('hidden');
      setTimeout(function () { $('recordingBanner').classList.add('hidden'); }, 3000);
    }
  };

  applyLang();
})();
</script>
</body>
</html>
