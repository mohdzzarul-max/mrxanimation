<title>ZSCENTS Clearance — Ep01 Scene 01</title>
<!--
  ZSCENTS CLEARANCE — EPISODE 01 / SCENE 01   (rebuild v2)
  12 s · 1080x1920 · 24 fps. Mr X is animated on twos (12 drawings/s); camera and motion graphics on ones.

  Shots
    A  0.00–3.42  medium shot, push-in. "Weh! ZSCENTS tengah CLEARANCE!" + point at the bottle.
                  Anticipation dip, then the bottle is lifted toward camera → cut on action.
    B  3.42–7.00  close-up insert of the bottle, ZSCENTS / CLEARANCE supers, glint, sparkles.
                  "Korang kena tengok offer kali ni!" (voice over the insert).
    C  7.00–12.0  medium shot. Examines the bottle, skeptical look, pause, glance at camera.
                  X-BOT (off-screen right) "MR X!!" → eyes snap wide, head turn to screen-right, hold.

  Mr X design follows the four-view turnaround: full black mask (no mouth, ever), skin-coloured eye
  openings, blue eyes, white horn markings over the brows + cheek stripes, black tee, wristbands.
  Head views are separate drawings (front, 3/4-right, and a shut-eye inbetween for the turn).

  URL:  ?t=11.99 hold a frame · ?sheet=1 model sheet · ?bg=1 empty set · ?capture=1 (render.js)
  Product: assets/zscents-bottle.png (transparent PNG, upright, bottom edge = bottle base) replaces
  the drawn bottle in both shots when present.
-->

  body.fit svg { height: 100vh; width: auto; }

</style>

<body>
<svg id="v" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">

  <!-- eye shapes, in eye-side local space (screen-right eye; the left eye is mirrored) -->

<g id="shotA">

<script>
(() => {
const P = new URLSearchParams(location.search);
const capture = P.get('capture') === '1';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const DURATION = 12;
const CUT_B = 3.42, CUT_C = 7.0;

// ================= helpers =================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const EASE = {
  lin: p => p,
  io: p => 0.5 - 0.5 * Math.cos(Math.PI * p),
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  back: p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  hold: p => (p < 1 ? 0 : 1),
};
const lerp = (a, b, k) => Array.isArray(a) ? a.map((v, i) => lerp(v, b[i], k)) : a + (b - a) * k;
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const a = keys[i - 1], b = keys[i];
    return lerp(a[1], b[1], EASE[b[2] || 'io']((t - a[0]) / (b[0] - a[0])));
  }
  return keys[keys.length - 1][1];
}
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const f1 = n => (Math.round(n * 10) / 10).toString();
let uid = 0;
// polygon with rounded corners: angular design, clean vector finish
function roundPoly(pts, r = 10) {
  const n = pts.length, rr = i => (Array.isArray(r) ? r[i] : r);
  const cut = (p, q, d) => { const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, k = Math.min(d / L, 0.5); return [p[0] + dx * k, p[1] + dy * k]; };
  let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = cut(p, pts[(i - 1 + n) % n], rr(i)), b = cut(p, pts[(i + 1) % n], rr(i));
    d += (i ? ' L ' : 'M ') + f1(a[0]) + ' ' + f1(a[1]) + ' Q ' + f1(p[0]) + ' ' + f1(p[1]) + ' ' + f1(b[0]) + ' ' + f1(b[1]);
  }
  return d + ' Z';
}
const along = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const angleOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
const nrm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L]; };
function quadPts(a, b, ra, rb) { const n = nrm(a, b); return [[a[0] + n[0] * ra, a[1] + n[1] * ra], [b[0] + n[0] * rb, b[1] + n[1] * rb], [b[0] - n[0] * rb, b[1] - n[1] * rb], [a[0] - n[0] * ra, a[1] - n[1] * ra]]; }
const quad = (a, b, ra, rb) => 'M ' + quadPts(a, b, ra, rb).map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L ') + ' Z';
function halfQuad(a, b, ra, rb, side) {
  const n = nrm(a, b).map(v => v * side), k = 0.15;
  return `M ${f1(a[0] + n[0] * ra * k)} ${f1(a[1] + n[1] * ra * k)} L ${f1(b[0] + n[0] * rb * k)} ${f1(b[1] + n[1] * rb * k)} L ${f1(b[0] + n[0] * rb)} ${f1(b[1] + n[1] * rb)} L ${f1(a[0] + n[0] * ra)} ${f1(a[1] + n[1] * ra)} Z`;
}
const set = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); };
const star = (x, y, s) => `M ${x} ${y - s} L ${x + s * 0.22} ${y - s * 0.22} L ${x + s} ${y} L ${x + s * 0.22} ${y + s * 0.22} L ${x} ${y + s} L ${x - s * 0.22} ${y + s * 0.22} L ${x - s} ${y} L ${x - s * 0.22} ${y - s * 0.22} Z`;

// palette (from the turnaround)
const C = {
  ink: '#0a0710', mask: '#17161e', maskSh: '#0b0a10', rim: '#a594ff',
  skin: '#f4c49a', skinSh: '#d99a6c', lidSkin: '#e0a57c',
  shirt: '#1b1a23', shirtSh: '#0e0d13', white: '#f6f3ff', iris: '#2fb3f2', irisDk: '#0f5d9a', band: '#121118',
};
const LW = 8; // main line weight

// ================= MR X: HEAD =================
// silhouettes share point order so the turn inbetween can blend between them
const SKULL_FRONT = [[0, -222], [64, -214], [130, -182], [170, -124], [184, -44], [178, 30], [152, 84], [92, 160], [30, 212], [0, 222], [-30, 212], [-92, 160], [-152, 84], [-178, 30], [-184, -44], [-170, -124], [-130, -182], [-64, -214]];
const SKULL_34    = [[14, -222], [82, -214], [148, -180], [184, -116], [196, -40], [190, 30], [166, 86], [112, 162], [56, 212], [30, 222], [-20, 212], [-96, 174], [-156, 110], [-188, 24], [-194, -60], [-176, -132], [-130, -186], [-60, -216]];
const SKULL_R   = [60, 40, 36, 22, 12, 10, 10, 10, 8, 8, 8, 10, 10, 10, 12, 22, 36, 40];
const SKULL_R34 = [60, 40, 36, 26, 16, 14, 14, 12, 10, 8, 30, 50, 60, 60, 60, 50, 40, 40];
// side placement per view: [tx, sx] for the screen-right side group and the screen-left side group
const SIDES = { 0: { R: [0, 1], L: [0, -1] }, 1: { R: [94, 0.54], L: [70, -1.04] } };

function makeHead(parent) {
  const id = ++uid;
  const g = mk('g', {}, parent);
  const tuft = mk('path', { fill: C.mask, stroke: C.ink, 'stroke-width': LW, 'stroke-linejoin': 'round' }, g);
  const clip = mk('clipPath', { id: `cSkull${id}` }, g);
  const clipP = mk('path', {}, clip);
  const rimFill = mk('path', { fill: C.rim }, g);
  const inner = mk('g', { 'clip-path': `url(#cSkull${id})` }, g);
  const darkFill = mk('path', { fill: C.mask }, inner);
  const shade = mk('path', { fill: C.maskSh }, inner);
  const sheen = mk('path', { fill: '#2b2840' }, inner);
  const sides = {};
  for (const s of ['R', 'L']) {
    const sg = mk('g', {}, inner);
    const brow = mk('g', {}, sg);
    const W = { fill: C.white, stroke: C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round' };
    // horn marking: sweeps from the forehead centre out over the brow to the temple
    mk('path', Object.assign({ d: 'M 30 -206 C 112 -200 170 -142 172 -64 C 172 -40 164 -22 150 -12 C 148 -44 144 -82 126 -114 C 106 -150 74 -180 30 -206 Z' }, W), brow);
    // inner spike rising from above the inner eye corner
    mk('path', Object.assign({ d: 'M 14 -26 C 24 -72 56 -122 100 -154 C 84 -118 68 -78 58 -34 Z' }, W), brow);
    // cheek stripe down to the jaw
    mk('path', Object.assign({ d: 'M 98 50 L 128 46 C 124 102 104 152 70 198 C 86 148 96 98 98 50 Z' }, W), sg);
    // eye
    const eye = mk('g', {}, sg);
    mk('use', { href: '#pOpen', fill: C.skin }, eye);
    mk('path', { d: 'M 14 18 Q 24 40 56 44 L 118 40', fill: 'none', stroke: C.skinSh, 'stroke-width': 8, 'clip-path': 'url(#cOpen)' }, eye);
    mk('use', { href: '#pScl', fill: '#fff' }, eye);
    const irisClip = mk('g', { 'clip-path': 'url(#cScl)' }, eye);
    const iris = mk('g', {}, irisClip);
    mk('circle', { r: 29, fill: C.iris, stroke: C.irisDk, 'stroke-width': 5 }, iris);
    mk('path', { d: 'M -18 16 A 24 24 0 0 0 20 14', fill: 'none', stroke: '#9fe6ff', 'stroke-width': 4, 'stroke-linecap': 'round' }, iris);
    const pupil = mk('circle', { r: 11, fill: '#05070c' }, iris);
    mk('circle', { cx: -9, cy: -10, r: 6, fill: '#fff' }, iris);
    const lowLine = mk('path', { fill: 'none', stroke: C.ink, 'stroke-width': 4, 'stroke-linecap': 'round' }, eye);
    const lidG = mk('g', { 'clip-path': 'url(#cOpen)' }, eye);
    const lid = mk('path', { fill: C.lidSkin }, lidG);
    const lowLid = mk('path', { fill: C.lidSkin }, lidG);
    mk('use', { href: '#pOpen', fill: 'none', stroke: C.ink, 'stroke-width': 5 }, eye);
    const lidLine = mk('path', { fill: 'none', stroke: C.ink, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, eye);
    sides[s] = { sg, brow, iris, pupil, lid, lidLine, lowLid, lowLine };
  }
  const nose = mk('path', { fill: 'none', stroke: '#2e2a44', 'stroke-width': 6, 'stroke-linecap': 'round' }, inner);
  const outline = mk('path', { fill: 'none', stroke: C.ink, 'stroke-width': LW, 'stroke-linejoin': 'round' }, g);

  // p: { view 0..1, eyes: {R:{o,low,gx,gy,iris,pupil,brow}, L:{...}}, tuftRot }
  function update(p) {
    const v = p.view;
    const pts = lerp(SKULL_FRONT, SKULL_34, v), rad = lerp(SKULL_R, SKULL_R34, v);
    const d = roundPoly(pts, rad);
    clipP.setAttribute('d', d); rimFill.setAttribute('d', d); outline.setAttribute('d', d);
    set(darkFill, { d, transform: `translate(${f1(-10 + 2 * v)} 4)` });
    shade.setAttribute('d', `M -260 -260 L ${f1(-120 + 70 * v)} -260 C ${f1(-156 + 40 * v)} -150 ${f1(-168 + 40 * v)} 20 ${f1(-60 + 60 * v)} 260 L -260 260 Z`);
    sheen.setAttribute('d', `M ${f1(-120 + 60 * v)} -150 C ${f1(-90 + 60 * v)} -190 ${f1(-30 + 60 * v)} -202 ${f1(20 + 60 * v)} -204 C ${f1(-40 + 60 * v)} -184 ${f1(-84 + 60 * v)} -160 ${f1(-104 + 60 * v)} -128 Z`);
    const tx = 12 * v;
    tuft.setAttribute('d', `M ${f1(-26 + tx)} -208 C ${f1(-16 + tx)} -238 ${f1(6 + tx)} -264 ${f1(38 + tx)} -282 C ${f1(28 + tx)} -258 ${f1(26 + tx)} -236 ${f1(30 + tx)} -206 Z`);
    tuft.setAttribute('transform', `rotate(${f1(p.tuftRot || 0)} ${f1(tx)} -210)`);
    nose.setAttribute('d', 'M 112 4 L 128 54 L 112 70');
    nose.setAttribute('opacity', '0');
    const sp = { R: lerp(SIDES[0].R, SIDES[1].R, v), L: lerp(SIDES[0].L, SIDES[1].L, v) };
    for (const s of ['R', 'L']) {
      const S = sides[s], e = p.eyes[s], [tx2, sx] = sp[s];
      S.sg.setAttribute('transform', `translate(${f1(tx2)} 0) scale(${sx.toFixed(3)} 1)`);
      // eye openness: 0 shut, 1 his confident half-lid, 1.35 wide
      const o = e.o;
      const lin = o <= 1 ? lerp(38, 0, o) : lerp(0, -24, (o - 1) / 0.35);
      const lout = o <= 1 ? lerp(30, -22, o) : lerp(-22, -50, (o - 1) / 0.35);
      S.lid.setAttribute('d', `M 0 -80 L 170 -80 L 170 ${f1(lout - 4)} L 150 ${f1(lout)} L 16 ${f1(lin)} L 0 ${f1(lin)} Z`);
      S.lidLine.setAttribute('d', `M 14 ${f1(lin + 2)} L 150 ${f1(lout)} L 162 ${f1(lout - 9)}`);
      const low = e.low || 0; // lower-lid squint
      S.lowLid.setAttribute('d', `M 0 70 L 170 70 L 170 ${f1(30 - low * 18)} L 0 ${f1(40 - low * 18)} Z`);
      S.lowLine.setAttribute('d', `M 36 ${f1(32 - low * 16)} Q 90 ${f1(36 - low * 18)} 132 ${f1(16 - low * 14)}`);
      const gxl = e.gx * Math.sign(sx); // mirrored side flips gaze
      S.iris.setAttribute('transform', `translate(${f1(86 + gxl * 24)} ${f1(2 + e.gy * 9)}) scale(${(e.iris || 1).toFixed(3)})`);
      S.pupil.setAttribute('r', f1(11 * (e.pupil || 1)));
      S.brow.setAttribute('transform', `translate(0 ${f1(-(e.brow || 0))}) rotate(${f1(-(e.brow || 0) * 0.2)} 90 -100)`);
    }
  }
  return { g, update };
}

// ================= MR X: HANDS (separate drawings, swapped per pose) =================
// local space: wrist at origin, forearm direction = +y
function drawHand(g, kind) {
  g.innerHTML = '';
  const S = { fill: C.skin, stroke: C.ink, 'stroke-width': 7, 'stroke-linejoin': 'round' };
  const L = { fill: 'none', stroke: C.ink, 'stroke-width': 5, 'stroke-linecap': 'round' };
  if (kind === 'fist') {
    mk('path', Object.assign({ d: roundPoly([[-34, -2], [36, -2], [44, 38], [38, 84], [-26, 92], [-44, 46]], 12) }, S), g);
    mk('path', { d: 'M 22 0 L 40 40 L 34 82 L 14 88 Z', fill: C.skinSh }, g);
    mk('path', Object.assign({ d: 'M -8 58 L -4 90 M 14 56 L 18 88' }, L), g);
    mk('path', Object.assign({ d: roundPoly([[-44, 8], [-26, 4], [-18, 50], [-36, 62]], 10) }, S), g);
  } else if (kind === 'point') {
    mk('path', Object.assign({ d: roundPoly([[-30, -2], [32, -2], [40, 44], [30, 70], [-26, 72], [-36, 40]], 12) }, S), g);
    mk('path', { d: 'M 18 0 L 36 44 L 28 66 L 12 68 Z', fill: C.skinSh }, g);
    mk('path', Object.assign({ d: roundPoly([[-30, 50], [-8, 50], [-6, 150], [-26, 152]], 10) }, S), g);
    mk('path', Object.assign({ d: 'M -4 62 L 26 64 M -2 46 L 30 46' }, L), g);
    mk('path', Object.assign({ d: roundPoly([[24, 6], [52, -26], [64, -18], [40, 26]], 10) }, S), g);
  } else if (kind === 'grip') {
    // knuckles to camera, fingers wrapped round the bottle
    mk('path', Object.assign({ d: roundPoly([[-52, -50], [52, -50], [56, 6], [46, 40], [-46, 40], [-56, 6]], 14) }, S), g);
    mk('path', { d: 'M 30 -50 L 54 -48 L 56 6 L 44 38 L 24 38 Z', fill: C.skinSh }, g);
    mk('path', Object.assign({ d: 'M -50 -26 L 50 -28 M -52 -4 L 52 -6 M -48 18 L 48 16' }, L), g);
    mk('path', Object.assign({ d: roundPoly([[-56, -54], [-4, -62], [10, -50], [-40, -34]], 10) }, S), g);
  }
}

// ================= BOTTLE (from the character sheet: black glass, gold collar, white brush X) =================
let productImg = null;
const BOTTLE_BODY = roundPoly([[-74, -178], [74, -178], [88, -162], [88, -14], [74, 0], [-74, 0], [-88, -14], [-88, -162]], 5);
function drawBottle(g) {
  g.innerHTML = '';
  if (productImg) { mk('image', { href: productImg, x: -130, y: -300, width: 260, height: 300, preserveAspectRatio: 'xMidYMax meet' }, g); return; }
  const I = { stroke: C.ink, 'stroke-width': 7, 'stroke-linejoin': 'round', class: 'ns' };
  mk('path', Object.assign({ d: roundPoly([[-46, -272], [46, -272], [48, -204], [-48, -204]], 6), fill: '#141319' }, I), g);
  for (const x of [-30, -15, 0, 15, 30]) mk('path', { d: `M ${x} -264 L ${x} -212`, stroke: '#2f2b44', 'stroke-width': 4, class: 'ns' }, g);
  mk('path', { d: 'M -38 -266 L -30 -266 L -30 -210 L -38 -210 Z', fill: '#4a4566' }, g);
  mk('path', Object.assign({ d: roundPoly([[-36, -204], [36, -204], [36, -178], [-36, -178]], 3), fill: 'url(#gGold)' }, I), g);
  mk('path', Object.assign({ d: BOTTLE_BODY, fill: 'url(#gGlass)' }, I), g);
  mk('path', { d: roundPoly([[-70, -164], [70, -164], [74, -14], [-74, -14]], 4), fill: 'none', stroke: '#3c3756', 'stroke-width': 3, class: 'ns' }, g);
  mk('path', { d: 'M -44 -132 L -30 -140 L 46 -42 L 30 -36 Z', fill: C.white, stroke: C.ink, 'stroke-width': 3, class: 'ns' }, g);
  mk('path', { d: 'M 40 -138 L 50 -128 L -32 -38 L -46 -46 Z', fill: C.white, stroke: C.ink, 'stroke-width': 3, class: 'ns' }, g);
  mk('path', { d: 'M -64 -154 L -50 -154 L -58 -24 L -70 -24 Z', fill: '#fff', opacity: 0.28 }, g);
  mk('path', { d: 'M 66 -152 L 76 -150 L 76 -26 L 68 -26 Z', fill: C.rim, opacity: 0.8 }, g);
}

// ================= MR X: BODY RIG (medium shot) =================
function makeArm(parent) {
  const g = mk('g', {}, parent);
  const o1 = mk('path', { fill: C.ink, stroke: C.ink, 'stroke-width': 14, 'stroke-linejoin': 'round' }, g);
  const o2 = mk('path', { fill: C.ink, stroke: C.ink, 'stroke-width': 14, 'stroke-linejoin': 'round' }, g);

  return {
    g, set(S, E, Wr, shadeSide = 1) {

      set(s1, { d: halfQuad(S, E, 34, 30, shadeSide) }); set(s2, { d: halfQuad(E, Wr, 30, 26, shadeSide) });
      const long = Math.hypot(Wr[0] - E[0], Wr[1] - E[1]) > 1;
      band.style.display = bandHi.style.display = long ? '' : 'none';
      if (!long) return;
      const b0 = along(E, Wr, 0.70), b1 = along(E, Wr, 1.0);
      set(band, { d: roundPoly(quadPts(b0, b1, 38, 38), 6) });
      const h0 = along(E, Wr, 0.74), h1 = along(E, Wr, 0.96), n = nrm(E, Wr);
      set(bandHi, { d: `M ${f1(h0[0] + n[0] * 26)} ${f1(h0[1] + n[1] * 26)} L ${f1(h1[0] + n[0] * 26)} ${f1(h1[1] + n[1] * 26)}` });

}
function sleevePts(S, E) {
  const dx = E[0] - S[0], dy = E[1] - S[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const side = S[0] < 0 ? -1 : 1;
  let nx = -uy, ny = ux; if (nx * side < 0) { nx = -nx; ny = -ny; }
  const end = along(S, E, 0.5);
  return [[S[0] - ux * 36 - nx * 14, S[1] - uy * 36 - ny * 14], [S[0] + nx * 36 - ux * 18, S[1] + ny * 36 - uy * 18],
          [end[0] + nx * 54, end[1] + ny * 54], [end[0] - nx * 46, end[1] - ny * 46], [S[0] - nx * 44 + ux * 64, S[1] - ny * 44 + uy * 64]];
}

  // head: [hx, hy, rot]
  head: [[0, [0, 0, 0]], [0.36, [0, 6, -3]], [0.56, [0, -6, 3], 'out'], [1.0, [-2, 0, 2]], [1.9, [-2, 0, 1]], [2.05, [-2, 4, 3]], [2.5, [0, 0, 1]],

  rArm: [[0, [266, 1218, 286, 1452]], [0.62, [266, 1218, 286, 1452]], [0.78, [282, 1250, 300, 1470]],

function eyeAt(side, tc) {
  const [o, low, gx, gy, iris, pupil, brow] = track(tc, EYE_KEYS[side]);
  let oo = o;
  const d = tc - BLINK; // drawings: half, shut, half
  if (d >= -1e-6 && d < 1 / 12) oo = o * 0.45; else if (d >= 1 / 12 && d < 2 / 12) oo = 0; else if (d >= 2 / 12 && d < 3 / 12) oo = o * 0.6;
  return { o: oo, low, gx, gy, iris, pupil, brow };
}

let mrx;
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const tc = Math.floor(t * 12 + 1e-6) / 12;
  const inB = t >= CUT_B && t < CUT_C;
  $('shotA').style.display = inB ? 'none' : '';
  $('shotB').style.display = inB ? '' : 'none';
  if (inB) { seekCloseup(t, tc); return; }
  const [cs, cx, cy] = t < CUT_B ? track(t, K.camA) : track(t, K.camC);
  $('cam').setAttribute('transform', `translate(${f1(540 + cx)} ${f1(760 + cy)}) scale(${cs.toFixed(4)}) translate(-540 -760)`);
  const ps = 1 + (cs - 1) * 0.5;
  $('bgCam').setAttribute('transform', `translate(${f1(540 + cx * 0.5)} ${f1(760 + cy * 0.5)}) scale(${ps.toFixed(4)}) translate(-540 -760)`);
  if (P.get('bg') === '1') { $('charLayer').style.display = 'none'; return; }
  const [bx, by, lean, sx, sy] = track(tc, K.body);
  const [hx, hy, hr] = track(tc, K.head);
  const [rex, rey, rwx, rwy] = track(tc, K.rArm);
  const [lex, ley, lwx, lwy, bRot, bScale] = track(tc, K.lArm);
  const breathe = Math.sin(tc / 3.4 * Math.PI * 2) * 2;
  const view = track(tc, K.view);
  const eyes = { L: eyeAt('L', tc), R: eyeAt('R', tc) };
  if (view === 0.5) { eyes.L.o = 0; eyes.R.o = 0; }
  const pointing = tc >= 0.78 && tc < 2.8;
  mrx.pose({
    bx, by: by + breathe, lean, sx, sy, hx, hy: hy + breathe * 0.4, hr,
    rE: [rex, rey], rW: [rwx, rwy], rHand: pointing ? 'point' : 'fist', rHandRot: pointing ? 6 : 0,
    lE: [lex, ley], lW: [lwx, lwy], bRot, bScale,
    head: { view, eyes, tuftRot: track(tc, K.tuft) },
  });
}

// ================= model sheet (checked against the turnaround before animating) =================
function buildSheet() {
  const s = $('sheet'); s.style.display = '';
  $('shotA').style.display = 'none';
  mk('rect', { width: 1080, height: 1920, fill: '#2a2150' }, s);
  const base = { o: 1, low: 0, gx: 0, gy: 0, iris: 1, pupil: 1, brow: 0 };
  const E = (a, b) => ({ L: Object.assign({}, base, a), R: Object.assign({}, base, b || a) });
  const cells = [
    ['FRONT', 0, E({})], ['3/4 R', 1, E({})], ['TURN INB.', 0.5, E({ o: 0 })],
    ['SMUG', 0, E({ o: 0.9, low: 0.15, brow: -2 }, { o: 1.18, brow: 14 })], ['SKEPTIKAL', 0, E({ o: 0.55, low: 0.45, gx: -0.7, gy: 0.5, brow: -6 }, { o: 1.08, gx: -0.7, gy: 0.5, brow: 12 })],
    ['TERKEJUT', 0, E({ o: 1.35, iris: 0.84, pupil: 0.7, brow: 12 })], ['TERKEJUT 3/4', 1, E({ o: 1.33, gx: 1, iris: 0.84, pupil: 0.7, brow: 12 })],
  ];
  cells.forEach(([label, view, eyes], i) => {
    const x = 180 + (i % 3) * 360, y = 300 + Math.floor(i / 3) * 520;
    const g = mk('g', { transform: `translate(${x} ${y}) scale(0.62)`, filter: 'url(#fOutline)' }, s);
    makeHead(g).update({ view, eyes });
    mk('text', { x, y: y + 200, 'text-anchor': 'middle', 'font-size': 48, fill: '#fff' }, s).textContent = label;
  });
  ['fist', 'point', 'grip'].forEach((k, i) => { const g = mk('g', { transform: `translate(${640 + i * 150} ${i === 2 ? 1460 : 1300})`, filter: 'url(#fOutline)' }, s); drawHand(g, k); });
  const b = mk('g', { transform: 'translate(900 1840) scale(1.1)', filter: 'url(#fOutline)' }, s); drawBottle(b);
}

// ================= boot =================
function boot() {
  if (P.get('sheet') === '1') { buildSheet(); window.seek = () => {}; window.DURATION = DURATION; return; }
  buildBackground();
  mrx = makeMrX($('charLayer'));
  buildCloseup(); finishCloseupBottle();
  window.seek = seek;
  window.DURATION = DURATION;
  const tParam = P.get('t');
  if (tParam !== null) seek(parseFloat(tParam));
  else if (!capture) {
    const t0 = performance.now();
    const loop = now => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else seek(0);
}
if (!capture) document.body.classList.add('fit');
const go = () => document.fonts.load('150px Bangers').then(boot, boot);
const img = new Image();
img.onload = () => { productImg = img.src; go(); };
img.onerror = go;
img.src = 'assets/zscents-bottle.png';
})();
